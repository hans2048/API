<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Inspector</title>
<style>
  :root {
    --bg:          #f0f4f8;
    --surface:     #ffffff;
    --surface-2:   #f8fafc;
    --border:      #e2e8f0;
    --border-2:    #f1f5f9;
    --text-1:      #0f172a;
    --text-2:      #475569;
    --text-3:      #94a3b8;
    --accent:      #4f46e5;
    --accent-bg:   #eef2ff;
    --accent-dark: #4338ca;
    --shadow-sm:   0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md:   0 4px 16px rgba(0,0,0,.08);
    --r:    8px;
    --r-sm: 5px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 16px;
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: var(--text-1);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ─────────────────────────────── */
  #app-header {
    height: 50px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 14px;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }

  .logo {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 17px; color: var(--text-1);
    letter-spacing: -0.3px; flex-shrink: 0;
  }
  .logo-mark {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; flex-shrink: 0;
  }

  .h-sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
  .h-label { font-size: 13px; font-weight: 500; color: var(--text-3); flex-shrink: 0; }

  /* Segmented control */
  .seg {
    display: flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 2px; gap: 1px;
  }
  .seg-btn {
    padding: 3px 11px;
    border: none; background: transparent;
    border-radius: 3px;
    font-size: 13px; font-weight: 500;
    color: var(--text-2); cursor: pointer;
    transition: all .15s; white-space: nowrap; line-height: 1.6;
  }
  .seg-btn.active {
    background: var(--surface); color: var(--accent);
    box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600;
  }
  .seg-btn:hover:not(.active) { color: var(--text-1); background: var(--border-2); }

  .h-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 13px;
    background: var(--accent); color: #fff;
    border: none; border-radius: var(--r-sm);
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .15s; white-space: nowrap;
    line-height: 1.6; text-decoration: none;
  }
  .btn-primary:hover { background: var(--accent-dark); }

  .btn-ghost {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 13px;
    background: transparent; color: var(--text-2);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all .15s; white-space: nowrap; line-height: 1.6;
  }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text-1); border-color: #cbd5e1; }

  #file-input { display: none; }

  /* ── App Body ────────────────────────────── */
  #app-body { flex: 1; display: flex; overflow: hidden; }

  /* ── Left Sidebar ────────────────────────── */
  #sidebar {
    width: 280px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }

  .tab-header {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; padding: 0 10px;
  }
  .tab-btn {
    flex: 1; padding: 10px 4px 9px;
    border: none; background: none; cursor: pointer;
    font-size: 12px; font-weight: 700; color: var(--text-3);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    letter-spacing: 0.7px; text-transform: uppercase;
    transition: all .15s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text-2); }

  .tab-content { display: none; overflow-y: auto; flex: 1; padding: 8px; }
  .tab-content.active { display: flex; flex-direction: column; }

  /* ── Hierarchy Items ─────────────────────── */
  .hierarchy-item {
    cursor: pointer; padding: 4px 7px; margin-bottom: 1px;
    border-radius: var(--r-sm);
    display: flex; align-items: center; gap: 4px;
    font-size: 13px; color: var(--text-2);
    transition: background .1s, color .1s; line-height: 1.65;
  }
  .hierarchy-item:hover { background: var(--accent-bg); color: var(--accent); }
  .hierarchy-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }

  .hierarchy-children {
    margin-left: 12px;
    border-left: 1px solid var(--border);
    padding-left: 6px;
  }
  .hierarchy-children.hg-collapsed { display: none; }

  .hg-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; font-size: 10px;
    cursor: pointer; color: var(--text-3); user-select: none; flex-shrink: 0;
    border-radius: 3px; transition: all .15s;
  }
  .hg-toggle:hover { background: var(--border); color: var(--accent); }

  .empty-hint {
    padding: 20px 10px; font-size: 13px; color: var(--text-3);
    font-style: italic; text-align: center; line-height: 1.8;
  }

  /* ItemType 그룹 헤더 */
  .it-group-head {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; margin: 6px 0 3px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.3px;
    color: var(--accent);
    background: var(--accent-bg);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    cursor: pointer; user-select: none;
    transition: background .12s;
  }
  .it-group-head:hover { background: #dde4ff; }

  /* ── SVG Canvas ──────────────────────────── */
  #canvas-area {
    flex: 1; display: flex; flex-direction: column;
    overflow: hidden; padding: 12px;
  }

  #svg-container {
    flex: 1; background: #fff;
    border-radius: var(--r); border: 1px solid var(--border);
    box-shadow: var(--shadow-md); overflow: hidden;
    cursor: crosshair; display: flex; position: relative;
  }

  .canvas-placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
  }
  .canvas-placeholder p { font-size: 16px; color: var(--text-3); }
  .canvas-placeholder label { cursor: pointer; }

  /* ── Inspector ───────────────────────────── */
  #inspector {
    width: 272px; flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-title {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 700; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.7px; flex-shrink: 0;
  }
  #inspector-content {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    font-size: 13px; color: var(--text-2); line-height: 1.65;
    text-align: left;
  }
  #inspector-content strong { color: var(--text-1); font-size: 13px; }
  #inspector-content pre {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 8px 10px;
    white-space: pre-wrap; word-wrap: break-word;
    font-size: 13px; line-height: 1.6;
    font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
    margin-top: 8px; color: var(--text-2);
  }

  /* ── SVG Highlight ───────────────────────── */
  [data-svg-selected="true"] {
    filter: drop-shadow(0 0 8px rgba(220, 38, 38, 0.85)) !important;
  }
  [data-svg-selected="true"], [data-svg-selected="true"] * {
    stroke: #dc2626 !important;
    stroke-width: 0.6px !important;
    fill: rgba(220, 38, 38, 0.07) !important;
  }

  /* ── SVG Modal ───────────────────────────── */
  .svg-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(15,23,42,.72); z-index: 9999;
    align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
  }
  .svg-modal.open { display: flex; }
  .svg-modal-box {
    background: #1a1b2e; border-radius: 12px;
    width: 88%; height: 88%;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.07);
  }
  .svg-modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; background: rgba(0,0,0,.2); flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .svg-modal-header h3 { margin: 0; color: #e2e8f0; font-size: 16px; font-weight: 600; }
  .svg-modal-actions { display: flex; gap: 8px; align-items: center; }
  .svg-modal-action-btn {
    background: rgba(255,255,255,.08); color: #94a3b8;
    border: 1px solid rgba(255,255,255,.1); padding: 5px 14px;
    border-radius: 6px; cursor: pointer; font-size: 13px; transition: all .15s;
  }
  .svg-modal-action-btn:hover { background: rgba(255,255,255,.16); color: #fff; }
  .svg-modal-close {
    background: none; border: none; color: #64748b;
    font-size: 22px; cursor: pointer; line-height: 1; padding: 0 4px;
    transition: color .15s;
  }
  .svg-modal-close:hover { color: #fff; }
  .svg-modal-body { flex: 1; overflow: auto; padding: 20px 24px; }
  .svg-modal-body pre {
    margin: 0; font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
    font-size: 14px; line-height: 1.8; white-space: pre;
  }
  .sv-bracket { color: #6272a4; }
  .sv-tag     { color: #50fa7b; }
  .sv-attr    { color: #8be9fd; }
  .sv-val     { color: #f1fa8c; }
  .sv-text    { color: #f8f8f2; font-style: italic; }
  .sv-comment { color: #6272a4; }

  /* 줌 여백 슬라이더 */
  .pad-ctrl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .pad-ctrl label { font-size: 13px; font-weight: 500; color: var(--text-3); white-space: nowrap; }
  .pad-ctrl input[type=range] {
    width: 72px; height: 3px; cursor: pointer;
    accent-color: var(--accent);
  }
  .pad-ctrl .pad-val {
    font-size: 12px; font-weight: 600; color: var(--accent);
    min-width: 34px; text-align: right;
  }
</style>
</head>
<body>

<!-- ── Header ── -->
<header id="app-header">
  <div class="logo">
    <div class="logo-mark">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </div>
    SVG Inspector
  </div>
  <div class="h-sep"></div>
  <span class="h-label">선택 모드</span>
  <div class="seg" id="mode-seg">
    <button class="seg-btn active" data-mode="name_attr">Tag그룹(해양)</button>
    <button class="seg-btn" data-mode="topmost">최상위 그룹</button>
    <button class="seg-btn" data-mode="exact">단일 객체</button>
  </div>
  <div class="h-sep"></div>
  <div class="pad-ctrl">
    <label for="pad-slider">줌 여백</label>
    <input type="range" id="pad-slider" min="5" max="100" step="5" value="40" />
    <span class="pad-val" id="pad-val">40%</span>
  </div>
  <div class="h-actions">
    <label class="btn-primary" for="file-input">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      SVG 열기
    </label>
    <input type="file" id="file-input" accept=".svg" />
    <button class="btn-ghost" id="svg-viewer-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
      </svg>
      소스 보기
    </button>
  </div>
</header>

<!-- ── App Body ── -->
<div id="app-body">

  <!-- Left Sidebar -->
  <aside id="sidebar">
    <div class="tab-header">
      <button class="tab-btn active" data-tab="hierarchy">Tags</button>
      <button class="tab-btn" data-tab="topology">Topology</button>
    </div>
    <div id="tab-hierarchy" class="tab-content active">
      <div id="hierarchy-content" class="empty-hint">SVG 파일을 열면<br>구조가 표시됩니다.</div>
    </div>
    <div id="tab-topology" class="tab-content">
      <div id="topology-content" class="empty-hint">SVG 파일을 열면<br>PipeRun 토폴로지가 표시됩니다.</div>
    </div>
  </aside>

  <!-- Canvas -->
  <main id="canvas-area">
    <div id="svg-container">
      <div class="canvas-placeholder" id="canvas-placeholder">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <p>SVG 파일을 열어 시작하세요</p>
        <label class="btn-primary" for="file-input">SVG 파일 선택</label>
      </div>
    </div>
  </main>

  <!-- Inspector -->
  <div id="inspector">
    <div class="panel-title">Properties</div>
    <div id="inspector-content"><p style="font-size:13px;color:var(--text-3);font-style:italic;line-height:1.8;">객체를 클릭하면 속성이 표시됩니다.</p></div>
  </div>

</div>

<!-- SVG Text Viewer Modal -->
<div id="svg-viewer-modal" class="svg-modal">
  <div class="svg-modal-box">
    <div class="svg-modal-header">
      <h3>SVG 소스 뷰어</h3>
      <div class="svg-modal-actions">
        <button class="svg-modal-action-btn" id="svg-copy-btn">클립보드 복사</button>
        <button class="svg-modal-close" id="svg-modal-close">&#215;</button>
      </div>
    </div>
    <div class="svg-modal-body">
      <pre id="svg-viewer-content"></pre>
    </div>
  </div>
</div>

<script>
  const fileInput       = document.getElementById('file-input');
  const svgContainer    = document.getElementById('svg-container');
  const inspectorContent = document.getElementById('inspector-content');
  const hierarchyContent = document.getElementById('hierarchy-content');
  const topologyContent  = document.getElementById('topology-content');

  // ── Selection mode (segmented control) ──
  function getSelectionMode() {
    const btn = document.querySelector('.seg-btn.active');
    return btn ? btn.dataset.mode : 'topmost';
  }

  document.querySelectorAll('.seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (activeSvgEl) renderHierarchy(activeSvgEl);
    });
  });

  // ── Tab switching ──
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  let rawSvgString  = '';
  let currentSelectedId = null;
  let viewBoxState  = { x: 0, y: 0, width: 800, height: 600 };
  let isPanning     = false;
  let startPan      = { x: 0, y: 0 };
  let activeSvgEl   = null;
  let zoomPadFactor = 0.40;

  // ── 줌 여백 슬라이더 ──
  const padSlider = document.getElementById('pad-slider');
  const padVal    = document.getElementById('pad-val');
  padSlider.addEventListener('input', () => {
    zoomPadFactor = padSlider.value / 100;
    padVal.textContent = padSlider.value + '%';
  });

  // ── File load ──
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      rawSvgString = ev.target.result;
      processAndRenderSVG(rawSvgString);
    };
    reader.readAsText(file);
  });

  function processAndRenderSVG(svgStr) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(svgStr, 'image/svg+xml');
    const svgEl = doc.querySelector('svg');
    if (!svgEl) { alert('Invalid SVG file'); return; }

    svgEl.querySelectorAll('title, desc').forEach(t => t.remove());
    svgEl.querySelectorAll('*').forEach(el => el.removeAttribute('title'));

    Array.from(svgEl.children).forEach(child => {
      if (child.tagName.toLowerCase() === 'g') child.setAttribute('data-root-g', 'true');
    });

    let idCounter = 0;
    svgEl.querySelectorAll('*').forEach(el => {
      if (!el.id) el.id = `svg-el-${idCounter++}`;
    });

    svgEl.setAttribute('width',  '100%');
    svgEl.setAttribute('height', '100%');

    if (!svgEl.hasAttribute('viewBox')) {
      const w = parseFloat(svgEl.getAttribute('width'))  || 800;
      const h = parseFloat(svgEl.getAttribute('height')) || 600;
      viewBoxState = { x: 0, y: 0, width: w, height: h };
    } else {
      const vb = svgEl.getAttribute('viewBox').split(' ').map(Number);
      viewBoxState = { x: vb[0], y: vb[1], width: vb[2], height: vb[3] };
    }

    applyViewBox(svgEl);
    activeSvgEl = svgEl;

    svgContainer.innerHTML = '';
    svgContainer.appendChild(svgEl);

    renderHierarchy(svgEl);
    renderTopology(svgEl);
  }

  // ── ViewBox / Zoom / Pan ──
  function applyViewBox(el) {
    el.setAttribute('viewBox', `${viewBoxState.x} ${viewBoxState.y} ${viewBoxState.width} ${viewBoxState.height}`);
  }

  function zoomFitToElement(el) {
    if (!activeSvgEl || !el) return;
    try {
      let bbox = el.getBBox();
      [`[data-pr-group="${el.id}"]`].forEach(sel => {
        document.querySelectorAll(sel).forEach(sib => {
          try {
            const sb = sib.getBBox();
            if (sb.width === 0 && sb.height === 0) return;
            const x1 = Math.min(bbox.x, sb.x);
            const y1 = Math.min(bbox.y, sb.y);
            const x2 = Math.max(bbox.x + bbox.width,  sb.x + sb.width);
            const y2 = Math.max(bbox.y + bbox.height, sb.y + sb.height);
            bbox = { x: x1, y: y1, width: x2 - x1, height: y2 - y1 };
          } catch(e) {}
        });
      });
      if (bbox.width === 0 && bbox.height === 0) return;
      const pad = Math.max(bbox.width, bbox.height) * zoomPadFactor;
      const rect = svgContainer.getBoundingClientRect();
      const aspect = rect.width / rect.height;
      let fw = bbox.width  + pad * 2;
      let fh = bbox.height + pad * 2;
      if (fw / fh < aspect) fw = fh * aspect; else fh = fw / aspect;
      viewBoxState = {
        x: bbox.x + bbox.width  / 2 - fw / 2,
        y: bbox.y + bbox.height / 2 - fh / 2,
        width: fw, height: fh
      };
      applyViewBox(activeSvgEl);
    } catch(e) {}
  }

  svgContainer.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (!activeSvgEl) return;
    const factor = e.deltaY > 0 ? 1.1 : 0.9;
    const rect = svgContainer.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const vx = viewBoxState.x + (mx / rect.width)  * viewBoxState.width;
    const vy = viewBoxState.y + (my / rect.height) * viewBoxState.height;
    const nw = viewBoxState.width  * factor;
    const nh = viewBoxState.height * factor;
    viewBoxState = { x: vx - (mx / rect.width) * nw, y: vy - (my / rect.height) * nh, width: nw, height: nh };
    applyViewBox(activeSvgEl);
  });

  svgContainer.addEventListener('mousedown', (e) => {
    if (e.button === 1 || e.button === 2 || e.shiftKey) {
      e.preventDefault();
      isPanning = true;
      startPan = { x: e.clientX, y: e.clientY };
      svgContainer.style.cursor = 'grabbing';
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (!isPanning || !activeSvgEl) return;
    const dx = e.clientX - startPan.x;
    const dy = e.clientY - startPan.y;
    const rect = svgContainer.getBoundingClientRect();
    viewBoxState.x -= (dx / rect.width)  * viewBoxState.width;
    viewBoxState.y -= (dy / rect.height) * viewBoxState.height;
    startPan = { x: e.clientX, y: e.clientY };
    applyViewBox(activeSvgEl);
  });

  window.addEventListener('mouseup', () => {
    isPanning = false;
    svgContainer.style.cursor = 'crosshair';
  });

  svgContainer.addEventListener('contextmenu', e => e.preventDefault());

  // ── Hierarchy Rendering ──
  function renderHierarchy(svgEl) {
    hierarchyContent.innerHTML = '';
    const mode = getSelectionMode();

    function makeHierarchyItem(child, displayName) {
      const item  = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'hierarchy-item';
      title.textContent = displayName;
      title.dataset.elementId = child.id;
      title.addEventListener('click', (e) => { e.stopPropagation(); selectElementById(child.id, [], true); });
      item.appendChild(title);
      return { item, title };
    }

    function makeGroupItem(tagValue, elementId, collapsed = false) {
      const item   = document.createElement('div');
      const title  = document.createElement('div');
      title.className = 'hierarchy-item';
      title.dataset.elementId = elementId;
      const toggle = document.createElement('span');
      toggle.className = 'hg-toggle';
      toggle.textContent = collapsed ? '▶' : '▼';
      const label = document.createElement('span');
      label.textContent = tagValue;
      title.appendChild(toggle);
      title.appendChild(label);
      item.appendChild(title);
      title.addEventListener('click', (e) => {
        e.stopPropagation();
        if (e.target === toggle) {
          const cc = item.querySelector(':scope > .hierarchy-children');
          if (cc) { const c = cc.classList.toggle('hg-collapsed'); toggle.textContent = c ? '▶' : '▼'; }
        } else {
          selectElementById(elementId, [], true);
        }
      });
      return item;
    }

    if (mode === 'name_attr') {
      // Tag <g>의 자식 요소 트리 구성 (기본 축소)
      function buildTagChildren(node, cont) {
        for (const child of Array.from(node.children)) {
          const t = child.tagName.toLowerCase();
          if (t === 'g') {
            const label = child.getAttribute('Tag') || (child.id ? `g [${child.id}]` : 'g');
            const gEl = makeGroupItem(label, child.id, true);
            const cc = document.createElement('div');
            cc.className = 'hierarchy-children hg-collapsed';
            buildTagChildren(child, cc);
            if (cc.children.length) gEl.appendChild(cc);
            cont.appendChild(gEl);
          } else {
            const dn = child.id ? `${child.tagName} [${child.id}]` : child.tagName;
            const { item } = makeHierarchyItem(child, dn);
            cont.appendChild(item);
          }
        }
      }

      // ItemType 섹션 헤더 (접기/펼치기)
      function makeItemTypeGroup(label) {
        const wrap = document.createElement('div');
        const head = document.createElement('div');
        head.className = 'it-group-head';
        const toggle = document.createElement('span');
        toggle.className = 'hg-toggle';
        toggle.textContent = '▶';
        const lbl = document.createElement('span');
        lbl.textContent = label;
        head.appendChild(toggle);
        head.appendChild(lbl);
        wrap.appendChild(head);
        head.addEventListener('click', () => {
          const cc = wrap.querySelector(':scope > .hierarchy-children');
          if (cc) { const c = cc.classList.toggle('hg-collapsed'); toggle.textContent = c ? '▶' : '▼'; }
        });
        return wrap;
      }

      // 모든 <g Tag="..."> 요소 수집 (재귀)
      function collectTagEls(node, arr) {
        for (const child of Array.from(node.children)) {
          if (child.tagName.toLowerCase() === 'g' && child.hasAttribute('Tag')) {
            arr.push(child);
          } else if (child.tagName.toLowerCase() === 'g') {
            collectTagEls(child, arr);
          }
        }
      }

      const tagEls = [];
      collectTagEls(svgEl, tagEls);

      // ItemType 기준 그룹핑
      const byType = new Map();
      const noType = [];
      for (const el of tagEls) {
        const it = el.getAttribute('ItemType');
        if (it) {
          if (!byType.has(it)) byType.set(it, []);
          byType.get(it).push(el);
        } else {
          noType.push(el);
        }
      }

      // 그룹 내 Tag값 내림차순 정렬
      const descByTag = (a, b) =>
        (b.getAttribute('Tag') || '').localeCompare(a.getAttribute('Tag') || '', undefined, { sensitivity: 'base' });

      // Tag <g> 하나를 하위 트리 포함하여 렌더링
      function renderTagItem(el, cont) {
        const gEl = makeGroupItem(el.getAttribute('Tag'), el.id, true);
        const subCc = document.createElement('div');
        subCc.className = 'hierarchy-children hg-collapsed';
        buildTagChildren(el, subCc);
        if (subCc.children.length) gEl.appendChild(subCc);
        cont.appendChild(gEl);
      }

      // ItemType 그룹 렌더링 (ItemType명 오름차순)
      [...byType.keys()].sort().forEach(itemType => {
        const elements = byType.get(itemType).sort(descByTag);
        const group = makeItemTypeGroup(itemType);
        const cc = document.createElement('div');
        cc.className = 'hierarchy-children hg-collapsed';

        if (itemType === 'PipeRun') {
          // 동일 Tag명 병합: Map은 삽입 순서(내림차순) 유지
          const mergedMap = new Map();
          elements.forEach(el => {
            const tag = el.getAttribute('Tag') || '';
            if (!mergedMap.has(tag)) mergedMap.set(tag, []);
            mergedMap.get(tag).push(el);
          });
          mergedMap.forEach((tagEls, tag) => {
            const primary = tagEls[0];
            // 2번째 이후 요소를 data-pr-group으로 연결
            tagEls.slice(1).forEach(el => {
              el.setAttribute('data-pr-group', primary.id);
              el.querySelectorAll('*').forEach(d => d.setAttribute('data-pr-group', primary.id));
            });
            const gEl = makeGroupItem(tag, primary.id, true);
            const subCc = document.createElement('div');
            subCc.className = 'hierarchy-children hg-collapsed';
            tagEls.forEach(el => buildTagChildren(el, subCc));
            if (subCc.children.length) gEl.appendChild(subCc);
            cc.appendChild(gEl);
          });
        } else {
          elements.forEach(el => renderTagItem(el, cc));
        }

        group.appendChild(cc);
        hierarchyContent.appendChild(group);
      });

      // Non-ItemType 마지막에 추가
      if (noType.length > 0) {
        noType.sort(descByTag);
        const group = makeItemTypeGroup('Non-ItemType');
        const cc = document.createElement('div');
        cc.className = 'hierarchy-children hg-collapsed';
        noType.forEach(el => renderTagItem(el, cc));
        group.appendChild(cc);
        hierarchyContent.appendChild(group);
      }

    } else {
      function buildTree(node, container) {
        Array.from(node.children).forEach(child => {
          const tag = child.tagName.toLowerCase();
          if (mode === 'topmost') {
            if (tag === 'g' && child.parentElement === svgEl) {
              const na = child.getAttribute('name') || child.getAttribute('Name') || child.id;
              const dn = na ? `[${na}] ${child.tagName}` : `${child.tagName}#${child.id || ''}`;
              const { item } = makeHierarchyItem(child, dn);
              container.appendChild(item);
            }
          } else if (mode === 'exact') {
            if (child.id || tag === 'g') {
              const na = child.getAttribute('name') || child.getAttribute('Name') || child.id;
              const dn = na ? `[${na}] ${child.tagName}` : `${child.tagName}#${child.id || ''}`;
              const { item } = makeHierarchyItem(child, dn);
              if (child.children.length > 0) {
                const cc = document.createElement('div');
                cc.className = 'hierarchy-children';
                buildTree(child, cc);
                if (cc.children.length > 0) item.appendChild(cc);
              }
              container.appendChild(item);
            }
          }
        });
      }
      buildTree(svgEl, hierarchyContent);
    }
  }

  // ── Topology Rendering ──
  function renderTopology(svgEl) {
    topologyContent.innerHTML = '';

    function makeHierarchyItem(child, displayName) {
      const item  = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'hierarchy-item';
      title.textContent = displayName;
      title.dataset.elementId = child.id;
      title.addEventListener('click', (e) => { e.stopPropagation(); selectElementById(child.id, [], true); });
      item.appendChild(title);
      return { item, title };
    }

    function makeGroupItem(label, elementId) {
      const item   = document.createElement('div');
      const title  = document.createElement('div');
      title.className = 'hierarchy-item';
      title.dataset.elementId = elementId;
      const toggle = document.createElement('span');
      toggle.className = 'hg-toggle';
      toggle.textContent = '▼';
      title.appendChild(toggle);
      title.appendChild(document.createTextNode(' ' + label));
      item.appendChild(title);
      title.addEventListener('click', (e) => {
        e.stopPropagation();
        if (e.target === toggle) {
          const cc = item.querySelector(':scope > .hierarchy-children');
          if (cc) { const c = cc.classList.toggle('hg-collapsed'); toggle.textContent = c ? '▶' : '▼'; }
        } else { selectElementById(elementId, [], true); }
      });
      return item;
    }

    function isPipeRun(el) {
      return el.tagName.toLowerCase() === 'g' && el.getAttribute('ItemType') === 'PipeRun';
    }

    function buildGroupContent(node, cont) {
      for (const child of node.children) {
        const t = child.tagName.toLowerCase();
        if (isPipeRun(child)) {
          const label = child.getAttribute('Tag') || child.getAttribute('name') || child.id || 'PipeRun';
          const groupEl = makeGroupItem(label, child.id);
          const cc = document.createElement('div'); cc.className = 'hierarchy-children';
          buildGroupContent(child, cc);
          if (cc.children.length) groupEl.appendChild(cc);
          cont.appendChild(groupEl);
        } else if (t === 'g') {
          const na = child.getAttribute('name') || child.getAttribute('Name');
          const { item } = makeHierarchyItem(child, na || `g [${child.id}]`);
          const cc = document.createElement('div'); cc.className = 'hierarchy-children';
          buildGroupContent(child, cc);
          if (cc.children.length) item.appendChild(cc);
          cont.appendChild(item);
        } else {
          const { item } = makeHierarchyItem(child, child.id ? `${child.tagName} [${child.id}]` : child.tagName);
          cont.appendChild(item);
        }
      }
    }

    const mergedGroups = new Map();
    const seqCollector = [];

    function processSequential(children, cont, state) {
      for (const child of Array.from(children)) {
        if (isPipeRun(child)) {
          const label = child.getAttribute('Tag') || child.getAttribute('name') || child.id || 'PipeRun';
          if (mergedGroups.has(label)) {
            const existing = mergedGroups.get(label);
            buildGroupContent(child, existing.cc);
            child.setAttribute('data-pr-group', existing.firstId);
            child.querySelectorAll('*').forEach(d => d.setAttribute('data-pr-group', existing.firstId));
            state.cc = existing.cc;
            state.groupId = existing.firstId;
          } else {
            const groupEl = makeGroupItem(label, child.id);
            const cc = document.createElement('div'); cc.className = 'hierarchy-children';
            buildGroupContent(child, cc);
            if (cc.children.length) groupEl.appendChild(cc);
            cont.appendChild(groupEl);
            mergedGroups.set(label, { cc, firstId: child.id, seqAdded: false });
            state.cc = cc;
            state.groupId = child.id;
          }
        } else if (child.tagName.toLowerCase() === 'g') {
          const seqVal = child.getAttribute('Seq');
          if (seqVal && seqVal.includes(':') && child.getAttribute('ItemType') !== 'PipeRun') {
            const ci = seqVal.lastIndexOf(':');
            seqCollector.push({
              el: child,
              topologyName: seqVal.substring(0, ci),
              sortOrder: parseInt(seqVal.substring(ci + 1), 10) || 0
            });
          } else {
            processSequential(child.children, cont, state);
          }
        } else if (state.cc) {
          child.setAttribute('data-pr-group', state.groupId);
          child.querySelectorAll('*').forEach(d => d.setAttribute('data-pr-group', state.groupId));
          const dn = child.id ? `${child.tagName} [${child.id}]` : child.tagName;
          const { item } = makeHierarchyItem(child, dn);
          state.cc.appendChild(item);
        }
      }
    }

    processSequential(svgEl.children, topologyContent, { cc: null, groupId: null });

    seqCollector
      .sort((a, b) => a.sortOrder - b.sortOrder)
      .forEach(({ el, topologyName, sortOrder }) => {
        const group = mergedGroups.get(topologyName);
        if (!group) return;
        if (!group.seqAdded) {
          const sep = document.createElement('div');
          sep.style.cssText = 'border-top:1px solid var(--border);margin:6px 2px 4px;font-size:12px;color:var(--text-3);padding-top:4px;user-select:none;letter-spacing:.3px;';
          sep.textContent = '── 연결 구성요소';
          group.cc.appendChild(sep);
          group.seqAdded = true;
        }
        const label = el.getAttribute('Tag') || el.getAttribute('name') || el.getAttribute('Name') || el.id || `seq:${sortOrder}`;
        const { item } = makeHierarchyItem(el, label);
        group.cc.appendChild(item);
        el.setAttribute('data-pr-group', group.firstId);
        el.querySelectorAll('*').forEach(d => d.setAttribute('data-pr-group', group.firstId));
      });

    if (!topologyContent.children.length) {
      topologyContent.innerHTML = '<div class="empty-hint">ItemType="PipeRun" 요소가<br>없습니다.</div>';
    }
  }

  // ── Click Handler ──
  svgContainer.addEventListener('click', (e) => {
    const mode = getSelectionMode();
    let target = e.target;
    let foundTarget = null;
    let domPath = [];

    while (target && target !== e.currentTarget && target.tagName.toLowerCase() !== 'svg') {
      domPath.unshift(target.tagName.toLowerCase() + (target.id ? `#${target.id}` : ''));
      if (target.getAttribute('data-root-g') === 'true') break;

      if (mode === 'name_attr' && target.tagName.toLowerCase() === 'g' && target.hasAttribute('Tag')) {
        foundTarget = target; break;
      }
      if (target.id) {
        if (mode === 'exact' && !foundTarget) foundTarget = target;
        else if (mode === 'topmost') foundTarget = target;
        else if (mode === 'name_attr' && !foundTarget) foundTarget = target;
      }
      target = target.parentElement;
    }

    document.querySelectorAll('[data-svg-selected="true"]').forEach(el => el.removeAttribute('data-svg-selected'));
    document.querySelectorAll('.hierarchy-item.active').forEach(el => el.classList.remove('active'));

    if (foundTarget) {
      e.stopPropagation();
      selectElementById(foundTarget.id, domPath);
    } else {
      inspectorContent.innerHTML = `<strong>DOM Path:</strong><br><span style="color:var(--text-3);font-size:12px;">${domPath.join(' › ')}</span><br><br><span style="color:#ef4444;">선택 모드에 맞는 요소를 찾을 수 없습니다.</span>`;
    }
  });

  function selectElementById(id, domPath = [], zoomFit = false) {
    if (!id) return;
    const foundTarget = document.getElementById(id);
    if (!foundTarget) return;

    document.querySelectorAll('[data-svg-selected="true"]').forEach(el => el.removeAttribute('data-svg-selected'));
    document.querySelectorAll('.hierarchy-item.active').forEach(el => el.classList.remove('active'));

    currentSelectedId = id;
    foundTarget.setAttribute('data-svg-selected', 'true');

    // data-pr-group 연관 요소 (Topology 병합 그룹)
    [`[data-pr-group="${id}"]`].forEach(sel => {
      document.querySelectorAll(sel).forEach(el => el.setAttribute('data-svg-selected', 'true'));
    });

    const props = {};
    for (const attr of foundTarget.attributes) {
      if (!['data-svg-selected','style','data-root-g'].includes(attr.name)) {
        props[attr.name] = attr.value;
      }
    }

    const pathHtml = domPath.length > 0
      ? `<strong>DOM Path:</strong><br><span style="color:var(--text-3);font-size:12px;">${domPath.join(' › ')}</span><br><br>`
      : '';
    inspectorContent.innerHTML = `${pathHtml}<strong>Element:</strong> ${foundTarget.tagName}<br><span style="color:var(--text-3);font-size:12px;">#${foundTarget.id}</span><br><br><strong>Attributes:</strong><pre>${JSON.stringify(props, null, 2)}</pre>`;

    // Tags탭: 선택 요소의 Tag <g> 조상을 찾아 탭 전환 + 경로 확장 + 스크롤
    let tagNavId = null;
    if (foundTarget.tagName.toLowerCase() === 'g' && foundTarget.hasAttribute('Tag')) {
      tagNavId = id;
    } else {
      let anc = foundTarget.parentElement;
      while (anc && anc.tagName && anc.tagName.toLowerCase() !== 'svg') {
        if (anc.tagName.toLowerCase() === 'g' && anc.hasAttribute('Tag')) {
          tagNavId = anc.id; break;
        }
        anc = anc.parentElement;
      }
    }

    if (tagNavId) {
      // Tags 탭으로 전환
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'hierarchy'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-hierarchy'));

      // Tags 탭 안의 hierarchy-item 탐색
      const hItems = Array.from(document.querySelectorAll('#hierarchy-content .hierarchy-item'));
      const hTarget = hItems.find(it => it.dataset.elementId === tagNavId);
      if (hTarget) {
        hTarget.classList.add('active');
        // 접혀 있는 모든 조상 펼치기
        let par = hTarget.parentElement;
        while (par && par.id !== 'hierarchy-content') {
          if (par.classList.contains('hierarchy-children') && par.classList.contains('hg-collapsed')) {
            par.classList.remove('hg-collapsed');
            const sib = par.previousElementSibling;
            if (sib) { const tog = sib.querySelector('.hg-toggle'); if (tog) tog.textContent = '▼'; }
          }
          par = par.parentElement;
        }
        hTarget.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    } else {
      // Tag 조상 없음: 현재 탭에서 일반 탐색
      const items = Array.from(document.querySelectorAll('.hierarchy-item'));
      const targetItem = items.find(it => it.dataset.elementId === id);
      if (targetItem) {
        targetItem.classList.add('active');
        targetItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    if (zoomFit) zoomFitToElement(foundTarget);
  }

  // ── SVG Text Viewer ──
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function hlAttrs(str) {
    const re = /([\w:.-]+)\s*=\s*"([^"]*)"/g;
    let result = '', last = 0, m;
    while ((m = re.exec(str)) !== null) {
      if (m.index > last) result += escHtml(str.slice(last, m.index));
      result += ` <span class="sv-attr">${escHtml(m[1])}</span>=<span class="sv-val">"${escHtml(m[2])}"</span>`;
      last = m.index + m[0].length;
    }
    if (last < str.length) result += escHtml(str.slice(last));
    return result;
  }

  function hlToken(tok) {
    if (tok.startsWith('<?') || tok.startsWith('<!')) {
      return `<span class="sv-comment">${escHtml(tok)}</span>`;
    }
    if (tok.startsWith('</')) {
      const name = tok.slice(2, -1).trim();
      return `<span class="sv-bracket">&lt;/</span><span class="sv-tag">${escHtml(name)}</span><span class="sv-bracket">&gt;</span>`;
    }
    const selfClose = tok.endsWith('/>');
    const inner = selfClose ? tok.slice(1, -2).trim() : tok.slice(1, -1).trim();
    const si = inner.search(/\s/);
    const tagName = si === -1 ? inner : inner.slice(0, si);
    const attrsStr = si === -1 ? '' : inner.slice(si);
    return `<span class="sv-bracket">&lt;</span><span class="sv-tag">${escHtml(tagName)}</span>${hlAttrs(attrsStr)}<span class="sv-bracket">${selfClose ? ' /&gt;' : '&gt;'}</span>`;
  }

  function buildSVGViewerHTML(svgStr) {
    const cleaned = svgStr.replace(/>\s+</g, '><').trim();
    const tokens  = cleaned.match(/<[^>]*>|[^<]+/g) || [];
    let depth = 0;
    const parts = [];
    for (const tok of tokens) {
      const t = tok.trim();
      if (!t) continue;
      if (t.startsWith('</')) {
        depth = Math.max(0, depth - 1);
        parts.push('  '.repeat(depth) + hlToken(t));
      } else if (t.startsWith('<') && (t.endsWith('/>') || t.startsWith('<?') || t.startsWith('<!'))) {
        parts.push('  '.repeat(depth) + hlToken(t));
      } else if (t.startsWith('<')) {
        parts.push('  '.repeat(depth) + hlToken(t));
        depth++;
      } else {
        parts.push('  '.repeat(depth) + `<span class="sv-text">${escHtml(t)}</span>`);
      }
    }
    return parts.join('\n');
  }

  document.getElementById('svg-viewer-btn').addEventListener('click', () => {
    if (!rawSvgString) { alert('SVG 파일을 먼저 로드해주세요.'); return; }
    document.getElementById('svg-viewer-content').innerHTML = buildSVGViewerHTML(rawSvgString);
    document.getElementById('svg-viewer-modal').classList.add('open');
  });

  document.getElementById('svg-modal-close').addEventListener('click', () => {
    document.getElementById('svg-viewer-modal').classList.remove('open');
  });

  document.getElementById('svg-viewer-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
  });

  document.getElementById('svg-copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(rawSvgString).then(() => {
      const btn = document.getElementById('svg-copy-btn');
      btn.textContent = '복사됨 ✓';
      setTimeout(() => { btn.textContent = '클립보드 복사'; }, 2000);
    });
  });
</script>
</body>
