<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Inspector</title>
<style>
  :root {
    --bg:          #f0f4f8;
    --surface:     #ffffff;
    --surface-2:   #f8fafc;
    --border:      #e2e8f0;
    --border-2:    #f1f5f9;
    --text-1:      #0f172a;
    --text-2:      #475569;
    --text-3:      #94a3b8;
    --accent:      #4f46e5;
    --accent-bg:   #eef2ff;
    --accent-dark: #4338ca;
    --shadow-sm:   0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md:   0 4px 16px rgba(0,0,0,.08);
    --r:    8px;
    --r-sm: 5px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 16px;
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: var(--text-1);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ─────────────────────────────── */
  #app-header {
    height: 50px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 14px;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }

  .logo {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 17px; color: var(--text-1);
    letter-spacing: -0.3px; flex-shrink: 0;
  }
  .logo-mark {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; flex-shrink: 0;
  }

  .h-sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
  .h-label { font-size: 13px; font-weight: 500; color: var(--text-3); flex-shrink: 0; }

  /* Segmented control */
  .seg {
    display: flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 2px; gap: 1px;
  }
  .seg-btn {
    padding: 3px 11px;
    border: none; background: transparent;
    border-radius: 3px;
    font-size: 13px; font-weight: 500;
    color: var(--text-2); cursor: pointer;
    transition: all .15s; white-space: nowrap; line-height: 1.6;
  }
  .seg-btn.active {
    background: var(--surface); color: var(--accent);
    box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600;
  }
  .seg-btn:hover:not(.active) { color: var(--text-1); background: var(--border-2); }

  .h-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 13px;
    background: var(--accent); color: #fff;
    border: none; border-radius: var(--r-sm);
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .15s; white-space: nowrap;
    line-height: 1.6; text-decoration: none;
  }
  .btn-primary:hover { background: var(--accent-dark); }

  .btn-ghost {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 13px;
    background: transparent; color: var(--text-2);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all .15s; white-space: nowrap; line-height: 1.6;
  }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text-1); border-color: #cbd5e1; }

  #file-input { display: none; }

  /* ── App Body ────────────────────────────── */
  #app-body { flex: 1; display: flex; overflow: hidden; }

  /* ── Left Sidebar ────────────────────────── */
  #sidebar {
    width: 280px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── Sidebar Tabs ────────────────────────── */
  .tab-header {
    display: flex; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab-btn {
    flex: 1; padding: 9px 4px 8px;
    border: none; background: none; cursor: pointer;
    font-size: 11px; font-weight: 700; color: var(--text-3);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    letter-spacing: 0.6px; text-transform: uppercase; transition: all .15s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text-2); }

  .tab-pane { display: none; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
  .tab-pane.active { display: flex; }
  .tab-scroll-area { flex: 1; overflow-y: auto; padding: 8px; }

  /* ── Hierarchy Items ─────────────────────── */
  .hierarchy-item {
    cursor: pointer; padding: 4px 7px; margin-bottom: 1px;
    border-radius: var(--r-sm);
    display: flex; align-items: center; gap: 4px;
    font-size: 13px; color: var(--text-2);
    transition: background .1s, color .1s; line-height: 1.65;
  }
  .hierarchy-item:hover { background: var(--accent-bg); color: var(--accent); }
  .hierarchy-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }

  .hierarchy-children {
    margin-left: 12px;
    border-left: 1px solid var(--border);
    padding-left: 6px;
  }
  .hierarchy-children.hg-collapsed { display: none; }

  .hg-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; font-size: 10px;
    cursor: pointer; color: var(--text-3); user-select: none; flex-shrink: 0;
    border-radius: 3px; transition: all .15s;
  }
  .hg-toggle:hover { background: var(--border); color: var(--accent); }

  /* SmartLabel 서브타이틀 */
  .hi-subtitle {
    display: block;
    font-size: 11px; color: #059669; font-weight: 400;
    margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .empty-hint {
    padding: 20px 10px; font-size: 13px; color: var(--text-3);
    font-style: italic; text-align: center; line-height: 1.8;
  }

  /* ItemType 그룹 헤더 */
  .it-group-head {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; margin: 6px 0 3px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.3px;
    color: var(--accent);
    background: var(--accent-bg);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    cursor: pointer; user-select: none;
    transition: background .12s;
  }
  .it-group-head:hover { background: #dde4ff; }

  /* ── PipeRun Tab ──────────────────────────── */
  .pr-top-item {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; margin: 4px 0 2px;
    font-size: 13px; font-weight: 700; color: var(--text-1);
    background: var(--surface-2); border: 1px solid var(--border);
    border-left: 3px solid #f59e0b;
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    cursor: pointer; user-select: none; transition: background .12s;
  }
  .pr-top-item:hover { background: #fef3c7; }
  .pr-top-item.active { background: #fef3c7; border-left-color: #d97706; color: #92400e; }

  .pr-sub-head {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 8px; margin: 3px 0 1px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.4px;
    color: var(--text-3); text-transform: uppercase;
    cursor: pointer; user-select: none;
  }
  .pr-sub-head:hover { color: var(--text-2); }

  .pr-leaf {
    padding: 3px 8px; font-size: 12px; color: var(--text-2);
    cursor: pointer; border-radius: var(--r-sm);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .1s;
  }
  .pr-leaf:hover { background: var(--accent-bg); color: var(--accent); }
  .pr-leaf.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }

  .pr-seq-badge {
    font-size: 10px; color: var(--text-3);
    font-family: 'Menlo','Consolas',monospace;
    margin-left: 4px;
  }

  /* ── SVG Canvas ──────────────────────────── */
  #canvas-area {
    flex: 1; display: flex; flex-direction: column;
    overflow: hidden; padding: 12px;
  }

  #svg-container {
    flex: 1; background: #fff;
    border-radius: var(--r); border: 1px solid var(--border);
    box-shadow: var(--shadow-md); overflow: hidden;
    cursor: crosshair; display: flex; position: relative;
  }

  .canvas-placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
  }
  .canvas-placeholder p { font-size: 16px; color: var(--text-3); }
  .canvas-placeholder label { cursor: pointer; }

  /* ── Inspector ───────────────────────────── */
  #inspector {
    width: 272px; flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-title {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 700; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.7px; flex-shrink: 0;
  }
  #inspector-content {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    font-size: 13px; color: var(--text-2); line-height: 1.65;
    text-align: left;
  }
  #inspector-content strong { color: var(--text-1); font-size: 13px; }
  #inspector-content pre {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 8px 10px;
    white-space: pre-wrap; word-wrap: break-word;
    font-size: 13px; line-height: 1.6;
    font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
    margin-top: 8px; color: var(--text-2);
  }

  /* ── SVG Highlight ───────────────────────── */
  [data-svg-selected="true"] {
    filter: drop-shadow(0 0 8px rgba(220, 38, 38, 0.85)) !important;
  }
  [data-svg-selected="true"], [data-svg-selected="true"] * {
    stroke: #dc2626 !important;
    stroke-width: 0.6px !important;
    fill: rgba(220, 38, 38, 0.07) !important;
  }

  /* ── SVG Modal ───────────────────────────── */
  .svg-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(15,23,42,.72); z-index: 9999;
    align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
  }
  .svg-modal.open { display: flex; }
  .svg-modal-box {
    background: #1a1b2e; border-radius: 12px;
    width: 88%; height: 88%;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.07);
  }
  .svg-modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; background: rgba(0,0,0,.2); flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .svg-modal-header h3 { margin: 0; color: #e2e8f0; font-size: 16px; font-weight: 600; }
  .svg-modal-actions { display: flex; gap: 8px; align-items: center; }
  .svg-modal-action-btn {
    background: rgba(255,255,255,.08); color: #94a3b8;
    border: 1px solid rgba(255,255,255,.1); padding: 5px 14px;
    border-radius: 6px; cursor: pointer; font-size: 13px; transition: all .15s;
  }
  .svg-modal-action-btn:hover { background: rgba(255,255,255,.16); color: #fff; }
  .svg-modal-close {
    background: none; border: none; color: #64748b;
    font-size: 22px; cursor: pointer; line-height: 1; padding: 0 4px;
    transition: color .15s;
  }
  .svg-modal-close:hover { color: #fff; }
  .svg-modal-body { flex: 1; overflow: auto; padding: 20px 24px; }
  .svg-modal-body pre {
    margin: 0; font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
    font-size: 13px; line-height: 1.8; white-space: pre;
    color: #e2e8f0;  /* 다크 배경에 밝은 텍스트 */
  }

  /* ── PipeRun 다이어그램 모달 ──────────────── */
  /* ── PipeRun 다이어그램 플로팅 패널 ──────────────── */
  #prd-modal {
    display: none; position: fixed; z-index: 9001;
    top: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(15,23,42,0.92);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    max-width: 92vw; min-width: 280px;
  }
  #prd-modal.open { display: block; }
  .prd-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; gap: 10px;
    background: rgba(0,0,0,0.22); flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,.08);
    border-radius: 12px 12px 0 0;
    cursor: move; user-select: none;
  }
  .prd-title {
    font-size: 12px; font-weight: 700; color: #fbbf24;
    font-family: 'Menlo','Consolas',monospace; letter-spacing: .4px;
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .prd-body { overflow: auto; padding: 12px; }

  /* 다이어그램 버튼 */
  .pr-diagram-btn {
    flex-shrink: 0; padding: 2px 8px; font-size: 10px; font-weight: 600;
    background: #1e3a5f; color: #60a5fa; border: 1px solid #1d4ed8;
    border-radius: 4px; cursor: pointer; transition: all .12s; white-space: nowrap;
  }
  .pr-diagram-btn:hover { background: #1d4ed8; color: #fff; }

  /* 줌 여백 슬라이더 */
  .pad-ctrl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .pad-ctrl label { font-size: 13px; font-weight: 500; color: var(--text-3); white-space: nowrap; }
  .pad-ctrl input[type=range] {
    width: 72px; height: 3px; cursor: pointer;
    accent-color: var(--accent);
  }
  .pad-ctrl .pad-val {
    font-size: 12px; font-weight: 600; color: var(--accent);
    min-width: 34px; text-align: right;
  }
  .pad-toggle-btn {
    padding: 2px 7px; font-size: 11px; font-weight: 600; border-radius: 4px;
    border: 1px solid var(--accent); background: var(--accent-bg); color: var(--accent);
    cursor: pointer; transition: all .15s; white-space: nowrap; line-height: 1.6;
  }
  .pad-toggle-btn.off {
    border-color: var(--border); background: var(--surface-2); color: var(--text-3);
  }

  /* ── Sidebar Search ──────────────────────── */
  .sidebar-search-wrap {
    padding: 8px 8px 6px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .sidebar-search {
    width: 100%; padding: 6px 10px; box-sizing: border-box;
    border: 1px solid var(--border); border-radius: var(--r-sm);
    font-size: 13px; color: var(--text-1);
    background: var(--surface-2); outline: none; transition: border-color .15s;
  }
  .sidebar-search:focus { border-color: var(--accent); background: #fff; }

  /* ── TopoMap ─────────────────────────────── */
  #topomap-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #topomap-panel {
    display: none; position: fixed; z-index: 9000;
    top: 48px; left: 50%; transform: translateX(-50%);
    background: rgba(8,12,22,0.98);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    box-shadow: 0 24px 72px rgba(0,0,0,0.8);
    width: min(1400px, 96vw);
    height: min(820px, 90vh);
    min-width: 560px; flex-direction: column;
  }
  #topomap-panel.open { display: flex; }
  .tmp-header {
    display: flex; align-items: center; gap: 7px; flex-shrink: 0;
    padding: 6px 12px;
    background: rgba(0,0,0,0.35);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px 12px 0 0;
    cursor: move; user-select: none;
  }
  .tmp-title {
    font-size: 12px; font-weight: 700; color: #fbbf24;
    font-family: monospace; white-space: nowrap;
  }
  .tmp-sep { width: 1px; height: 16px; background: #334155; flex-shrink: 0; }
  .tmp-lbl { font-size: 10px; color: #64748b; white-space: nowrap; }
  .tmp-input {
    padding: 2px 7px; font-size: 11px; height: 22px; width: 130px;
    background: #1e293b; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 4px; outline: none;
  }
  .tmp-input:focus { border-color: #3b82f6; }
  .tmp-btn {
    padding: 0 9px; font-size: 11px; height: 22px; cursor: pointer;
    background: #1e293b; color: #94a3b8;
    border: 1px solid #334155; border-radius: 4px; white-space: nowrap;
  }
  .tmp-btn:hover { background: #334155; color: #e2e8f0; }
  .tmp-btn.accent { background: #1e3a5f; color: #93c5fd; border-color: #3b82f6; }
  .tmp-btn.accent:hover { background: #1e4a80; }
  .tmp-status { font-size: 10px; color: #64748b; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tmp-body { flex: 1; min-height: 0; display: flex; overflow: hidden; border-radius: 0 0 12px 12px; }
  .tmp-rf { flex: 1; min-width: 0; position: relative; }
  .tmp-path-sidebar {
    display: none; width: 210px; flex-shrink: 0;
    background: #080c16; border-left: 1px solid #1e293b;
    overflow-y: auto; padding: 8px; border-radius: 0 0 12px 0;
  }
  .tmp-path-sidebar.open { display: flex; flex-direction: column; }
  .tmp-path-title { font-size: 11px; font-weight: 700; color: #fbbf24; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #1e293b; flex-shrink: 0; }
  .tmp-path-item { padding: 4px 6px; margin-bottom: 2px; border-radius: 4px; font-size: 10px; border-left: 3px solid transparent; cursor: default; }
  .tmp-path-item:hover { background: #1e293b; }
  .tmp-path-item b { display: block; color: #e2e8f0; font-size: 10.5px; }
  .tmp-path-item span { color: #64748b; }
  /* ReactFlow dark overrides */
  .react-flow { background: #060b14 !important; }
  .react-flow__background pattern circle { fill: #1e293b !important; }
  .react-flow__controls { background: rgba(15,23,42,0.9) !important; border: 1px solid #334155 !important; border-radius: 6px !important; }
  .react-flow__controls-button { background: #1e293b !important; border-color: #334155 !important; fill: #94a3b8 !important; }
  .react-flow__controls-button:hover { background: #334155 !important; }
  .react-flow__minimap { background: rgba(8,12,22,0.95) !important; border: 1px solid #334155 !important; }
  .react-flow__edge-path { stroke-opacity: 0.8; }
  .react-flow__attribution { display: none !important; }
</style>
<link rel="stylesheet" href="https://unpkg.com/reactflow@11/dist/style.css">
</head>
<body>

<!-- ── Header ── -->
<header id="app-header">
  <div class="logo">
    <div class="logo-mark">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </div>
    SVG Inspector
  </div>
  <div class="h-sep"></div>
  <label class="btn-primary" for="file-input">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    SVG 파일 열기
  </label>
  <input type="file" id="file-input" accept=".svg" />
  <button class="btn-ghost" id="svg-viewer-btn">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 18 22 12 16 6"/>
      <polyline points="8 6 2 12 8 18"/>
    </svg>
    소스 보기
  </button>
  <button class="btn-ghost" id="topomap-btn" disabled>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="2" y1="12" x2="22" y2="12"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </svg>
    TopoMap
  </button>
  <div class="h-sep"></div>
  <span class="h-label">선택 모드</span>
  <div class="seg" id="mode-seg">
    <button class="seg-btn active" data-mode="hayang">해양</button>
    <button class="seg-btn" data-mode="joseon">조선</button>
  </div>
  <div class="h-sep"></div>
  <div class="pad-ctrl">
    <label for="pad-slider">줌 여백</label>
    <button class="pad-toggle-btn" id="pad-toggle">ON</button>
    <input type="range" id="pad-slider" min="5" max="200" step="5" value="40" />
    <span class="pad-val" id="pad-val">40%</span>
  </div>
</header>

<!-- ── App Body ── -->

<!-- PipeRun Diagram (draggable floating panel) -->
<div id="prd-modal">
  <div class="prd-header" id="prd-header">
    <div class="prd-title" id="prd-title"></div>
    <button class="svg-modal-close" id="prd-close" style="color:#94a3b8;">&#215;</button>
  </div>
  <div class="prd-body" id="prd-content"></div>
