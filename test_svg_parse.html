<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Inspector</title>
<style>
  :root {
    --bg:          #f0f4f8;
    --surface:     #ffffff;
    --surface-2:   #f8fafc;
    --border:      #e2e8f0;
    --border-2:    #f1f5f9;
    --text-1:      #0f172a;
    --text-2:      #475569;
    --text-3:      #94a3b8;
    --accent:      #4f46e5;
    --accent-bg:   #eef2ff;
    --accent-dark: #4338ca;
    --shadow-sm:   0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md:   0 4px 16px rgba(0,0,0,.08);
    --r:    8px;
    --r-sm: 5px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 16px;
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: var(--text-1);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ─────────────────────────────── */
  #app-header {
    height: 50px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 14px;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }

  .logo {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 17px; color: var(--text-1);
    letter-spacing: -0.3px; flex-shrink: 0;
  }
  .logo-mark {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; flex-shrink: 0;
  }

  .h-sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
  .h-label { font-size: 13px; font-weight: 500; color: var(--text-3); flex-shrink: 0; }

  /* Segmented control */
  .seg {
    display: flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 2px; gap: 1px;
  }
  .seg-btn {
    padding: 3px 11px;
    border: none; background: transparent;
    border-radius: 3px;
    font-size: 13px; font-weight: 500;
    color: var(--text-2); cursor: pointer;
    transition: all .15s; white-space: nowrap; line-height: 1.6;
  }
  .seg-btn.active {
    background: var(--surface); color: var(--accent);
    box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600;
  }
  .seg-btn:hover:not(.active) { color: var(--text-1); background: var(--border-2); }

  .h-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 13px;
    background: var(--accent); color: #fff;
    border: none; border-radius: var(--r-sm);
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .15s; white-space: nowrap;
    line-height: 1.6; text-decoration: none;
  }
  .btn-primary:hover { background: var(--accent-dark); }

  .btn-ghost {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 13px;
    background: transparent; color: var(--text-2);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all .15s; white-space: nowrap; line-height: 1.6;
  }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text-1); border-color: #cbd5e1; }

  #file-input { display: none; }

  /* ── App Body ────────────────────────────── */
  #app-body { flex: 1; display: flex; overflow: hidden; }

  /* ── Left Sidebar ────────────────────────── */
  #sidebar {
    width: 280px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── Sidebar Tabs ────────────────────────── */
  .tab-header {
    display: flex; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab-btn {
    flex: 1; padding: 9px 4px 8px;
    border: none; background: none; cursor: pointer;
    font-size: 11px; font-weight: 700; color: var(--text-3);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    letter-spacing: 0.6px; text-transform: uppercase; transition: all .15s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text-2); }

  .tab-pane { display: none; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
  .tab-pane.active { display: flex; }
  .tab-scroll-area { flex: 1; overflow-y: auto; padding: 8px; }

  /* ── Hierarchy Items ─────────────────────── */
  .hierarchy-item {
    cursor: pointer; padding: 4px 7px; margin-bottom: 1px;
    border-radius: var(--r-sm);
    display: flex; align-items: center; gap: 4px;
    font-size: 13px; color: var(--text-2);
    transition: background .1s, color .1s; line-height: 1.65;
  }
  .hierarchy-item:hover { background: var(--accent-bg); color: var(--accent); }
  .hierarchy-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }

  .hierarchy-children {
    margin-left: 12px;
    border-left: 1px solid var(--border);
    padding-left: 6px;
  }
  .hierarchy-children.hg-collapsed { display: none; }

  .hg-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; font-size: 10px;
    cursor: pointer; color: var(--text-3); user-select: none; flex-shrink: 0;
    border-radius: 3px; transition: all .15s;
  }
  .hg-toggle:hover { background: var(--border); color: var(--accent); }

  /* SmartLabel 서브타이틀 */
  .hi-subtitle {
    display: block;
    font-size: 11px; color: #059669; font-weight: 400;
    margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .empty-hint {
    padding: 20px 10px; font-size: 13px; color: var(--text-3);
    font-style: italic; text-align: center; line-height: 1.8;
  }

  /* ItemType 그룹 헤더 */
  .it-group-head {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; margin: 6px 0 3px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.3px;
    color: var(--accent);
    background: var(--accent-bg);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    cursor: pointer; user-select: none;
    transition: background .12s;
  }
  .it-group-head:hover { background: #dde4ff; }

  /* ── PipeRun Tab ──────────────────────────── */
  .pr-top-item {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; margin: 4px 0 2px;
    font-size: 13px; font-weight: 700; color: var(--text-1);
    background: var(--surface-2); border: 1px solid var(--border);
    border-left: 3px solid #f59e0b;
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    cursor: pointer; user-select: none; transition: background .12s;
  }
  .pr-top-item:hover { background: #fef3c7; }
  .pr-top-item.active { background: #fef3c7; border-left-color: #d97706; color: #92400e; }

  .pr-sub-head {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 8px; margin: 3px 0 1px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.4px;
    color: var(--text-3); text-transform: uppercase;
    cursor: pointer; user-select: none;
  }
  .pr-sub-head:hover { color: var(--text-2); }

  .pr-leaf {
    padding: 3px 8px; font-size: 12px; color: var(--text-2);
    cursor: pointer; border-radius: var(--r-sm);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .1s;
  }
  .pr-leaf:hover { background: var(--accent-bg); color: var(--accent); }
  .pr-leaf.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }

  .pr-seq-badge {
    font-size: 10px; color: var(--text-3);
    font-family: 'Menlo','Consolas',monospace;
    margin-left: 4px;
  }

  /* ── SVG Canvas ──────────────────────────── */
  #canvas-area {
    flex: 1; display: flex; flex-direction: column;
    overflow: hidden; padding: 12px;
  }

  #svg-container {
    flex: 1; background: #fff;
    border-radius: var(--r); border: 1px solid var(--border);
    box-shadow: var(--shadow-md); overflow: hidden;
    cursor: crosshair; display: flex; position: relative;
  }

  .canvas-placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
  }
  .canvas-placeholder p { font-size: 16px; color: var(--text-3); }
  .canvas-placeholder label { cursor: pointer; }

  /* ── Inspector ───────────────────────────── */
  #inspector {
    width: 272px; flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-title {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 700; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.7px; flex-shrink: 0;
  }
  #inspector-content {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    font-size: 13px; color: var(--text-2); line-height: 1.65;
    text-align: left;
  }
  #inspector-content strong { color: var(--text-1); font-size: 13px; }
  #inspector-content pre {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 8px 10px;
    white-space: pre-wrap; word-wrap: break-word;
    font-size: 13px; line-height: 1.6;
    font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
    margin-top: 8px; color: var(--text-2);
  }

  /* ── SVG Highlight ───────────────────────── */
  [data-svg-selected="true"] {
    filter: drop-shadow(0 0 8px rgba(220, 38, 38, 0.85)) !important;
  }
  [data-svg-selected="true"], [data-svg-selected="true"] * {
    stroke: #dc2626 !important;
    stroke-width: 0.6px !important;
    fill: rgba(220, 38, 38, 0.07) !important;
  }

  /* ── SVG Modal ───────────────────────────── */
  .svg-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(15,23,42,.72); z-index: 9999;
    align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
  }
  .svg-modal.open { display: flex; }
  .svg-modal-box {
    background: #1a1b2e; border-radius: 12px;
    width: 88%; height: 88%;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.07);
  }
  .svg-modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; background: rgba(0,0,0,.2); flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .svg-modal-header h3 { margin: 0; color: #e2e8f0; font-size: 16px; font-weight: 600; }
  .svg-modal-actions { display: flex; gap: 8px; align-items: center; }
  .svg-modal-action-btn {
    background: rgba(255,255,255,.08); color: #94a3b8;
    border: 1px solid rgba(255,255,255,.1); padding: 5px 14px;
    border-radius: 6px; cursor: pointer; font-size: 13px; transition: all .15s;
  }
  .svg-modal-action-btn:hover { background: rgba(255,255,255,.16); color: #fff; }
  .svg-modal-close {
    background: none; border: none; color: #64748b;
    font-size: 22px; cursor: pointer; line-height: 1; padding: 0 4px;
    transition: color .15s;
  }
  .svg-modal-close:hover { color: #fff; }
  .svg-modal-body { flex: 1; overflow: auto; padding: 20px 24px; }
  .svg-modal-body pre {
    margin: 0; font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
    font-size: 13px; line-height: 1.8; white-space: pre;
    color: #e2e8f0;  /* 다크 배경에 밝은 텍스트 */
  }

  /* ── PipeRun 다이어그램 모달 ──────────────── */
  /* ── PipeRun 다이어그램 플로팅 패널 ──────────────── */
  #prd-modal {
    display: none; position: fixed; z-index: 9001;
    top: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(15,23,42,0.92);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    max-width: 92vw; min-width: 280px;
  }
  #prd-modal.open { display: block; }
  .prd-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; gap: 10px;
    background: rgba(0,0,0,0.22); flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,.08);
    border-radius: 12px 12px 0 0;
    cursor: move; user-select: none;
  }
  .prd-title {
    font-size: 12px; font-weight: 700; color: #fbbf24;
    font-family: 'Menlo','Consolas',monospace; letter-spacing: .4px;
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .prd-body { overflow: auto; padding: 12px; }

  /* 다이어그램 버튼 */
  .pr-diagram-btn {
    flex-shrink: 0; padding: 2px 8px; font-size: 10px; font-weight: 600;
    background: #1e3a5f; color: #60a5fa; border: 1px solid #1d4ed8;
    border-radius: 4px; cursor: pointer; transition: all .12s; white-space: nowrap;
  }
  .pr-diagram-btn:hover { background: #1d4ed8; color: #fff; }

  /* 줌 여백 슬라이더 */
  .pad-ctrl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .pad-ctrl label { font-size: 13px; font-weight: 500; color: var(--text-3); white-space: nowrap; }
  .pad-ctrl input[type=range] {
    width: 72px; height: 3px; cursor: pointer;
    accent-color: var(--accent);
  }
  .pad-ctrl .pad-val {
    font-size: 12px; font-weight: 600; color: var(--accent);
    min-width: 34px; text-align: right;
  }
  .pad-toggle-btn {
    padding: 2px 7px; font-size: 11px; font-weight: 600; border-radius: 4px;
    border: 1px solid var(--accent); background: var(--accent-bg); color: var(--accent);
    cursor: pointer; transition: all .15s; white-space: nowrap; line-height: 1.6;
  }
  .pad-toggle-btn.off {
    border-color: var(--border); background: var(--surface-2); color: var(--text-3);
  }

  /* ── Sidebar Search ──────────────────────── */
  .sidebar-search-wrap {
    padding: 8px 8px 6px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .sidebar-search {
    width: 100%; padding: 6px 10px; box-sizing: border-box;
    border: 1px solid var(--border); border-radius: var(--r-sm);
    font-size: 13px; color: var(--text-1);
    background: var(--surface-2); outline: none; transition: border-color .15s;
  }
  .sidebar-search:focus { border-color: var(--accent); background: #fff; }

  /* ── Map Tab ─────────────────────────────── */
  .map-form {
    padding: 10px 8px; display: flex; flex-direction: column; gap: 6px;
    flex-shrink: 0; border-bottom: 1px solid var(--border);
  }
  .map-row-label {
    font-size: 10px; font-weight: 700; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .map-input {
    width: 100%; padding: 5px 9px;
    border: 1px solid var(--border); border-radius: var(--r-sm);
    font-size: 12px; color: var(--text-1);
    background: var(--surface-2); outline: none; transition: border-color .15s;
  }
  .map-input:focus { border-color: var(--accent); background: #fff; }
  .map-find-btn {
    padding: 7px; background: var(--accent); color: #fff;
    border: none; border-radius: var(--r-sm);
    font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s;
  }
  .map-find-btn:hover { background: var(--accent-dark); }
  .map-status {
    font-size: 11px; color: var(--text-3); text-align: center; min-height: 16px; line-height: 1.5;
  }
  .map-status.error { color: #dc2626; }
  .map-status.success { color: #059669; }

  /* ── Map 다이어그램 플로팅 패널 (드래그 가능) ── */
  #map-diagram-panel {
    display: none; position: fixed; z-index: 9000;
    top: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(15,23,42,0.92);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    max-width: 92vw; min-width: 280px;
  }
  #map-diagram-panel.open { display: block; }
  .mdp-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; gap: 10px;
    background: rgba(0,0,0,0.22);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px 12px 0 0;
    cursor: move; user-select: none;
  }
  .mdp-title {
    font-size: 12px; font-weight: 700; color: #fbbf24;
    font-family: 'Menlo','Consolas',monospace; letter-spacing: .4px;
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mdp-body { overflow: auto; padding: 12px; }
</style>
</head>
<body>

<!-- ── Header ── -->
<header id="app-header">
  <div class="logo">
    <div class="logo-mark">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </div>
    SVG Inspector
  </div>
  <div class="h-sep"></div>
  <label class="btn-primary" for="file-input">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    SVG 파일 열기
  </label>
  <input type="file" id="file-input" accept=".svg" />
  <button class="btn-ghost" id="svg-viewer-btn">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 18 22 12 16 6"/>
      <polyline points="8 6 2 12 8 18"/>
    </svg>
    소스 보기
  </button>
  <div class="h-sep"></div>
  <span class="h-label">선택 모드</span>
  <div class="seg" id="mode-seg">
    <button class="seg-btn active" data-mode="hayang">해양</button>
    <button class="seg-btn" data-mode="joseon">조선</button>
  </div>
  <div class="h-sep"></div>
  <div class="pad-ctrl">
    <label for="pad-slider">줌 여백</label>
    <button class="pad-toggle-btn" id="pad-toggle">ON</button>
    <input type="range" id="pad-slider" min="5" max="200" step="5" value="40" />
    <span class="pad-val" id="pad-val">40%</span>
  </div>
</header>

<!-- ── App Body ── -->
<div id="app-body">

  <!-- Left Sidebar -->
  <aside id="sidebar">
    <div class="tab-header">
      <button class="tab-btn active" data-tab="hierarchy">Tags</button>
      <button class="tab-btn" data-tab="piperun">PipeRun</button>
      <button class="tab-btn" data-tab="map">Map</button>
    </div>
    <!-- Tags 탭 -->
    <div id="tab-hierarchy" class="tab-pane active">
      <div class="sidebar-search-wrap">
        <input class="sidebar-search" id="sidebar-search" placeholder="Tag 검색..." />
      </div>
      <div id="hierarchy-content" class="tab-scroll-area empty-hint">SVG 파일을 열면<br>구조가 표시됩니다.</div>
    </div>
    <!-- PipeRun 탭 -->
    <div id="tab-piperun" class="tab-pane">
      <div id="piperun-content" class="tab-scroll-area empty-hint">SVG 파일을 열면<br>PipeRun 구조가 표시됩니다.</div>
    </div>
    <!-- Map 탭 -->
    <div id="tab-map" class="tab-pane">
      <div class="map-form">
        <div class="map-row-label">From</div>
        <input class="map-input" id="map-from" list="map-tag-list" placeholder="시작 Tag 이름..." autocomplete="off"/>
        <div class="map-row-label">To</div>
        <input class="map-input" id="map-to"   list="map-tag-list" placeholder="끝 Tag 이름..." autocomplete="off"/>
        <button class="map-find-btn" id="map-find-btn">경로 찾기</button>
        <div class="map-status" id="map-status"></div>
      </div>
      <datalist id="map-tag-list"></datalist>
      <div id="map-content" class="tab-scroll-area"></div>
    </div>
  </aside>

  <!-- Canvas -->
  <main id="canvas-area">
    <div id="svg-container">
      <div class="canvas-placeholder" id="canvas-placeholder">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <p>SVG 파일을 열어 시작하세요</p>
        <label class="btn-primary" for="file-input">SVG 파일 선택</label>
      </div>
    </div>
  </main>

  <!-- Inspector -->
  <div id="inspector">
    <div class="panel-title">Properties</div>
    <div id="inspector-content"><p style="font-size:13px;color:var(--text-3);font-style:italic;line-height:1.8;">객체를 클릭하면 속성이 표시됩니다.</p></div>
  </div>

</div>

<!-- SVG Text Viewer Modal -->
<div id="svg-viewer-modal" class="svg-modal">
  <div class="svg-modal-box">
    <div class="svg-modal-header">
      <h3>SVG 소스 뷰어</h3>
      <div class="svg-modal-actions">
        <button class="svg-modal-action-btn" id="svg-copy-btn">클립보드 복사</button>
        <button class="svg-modal-close" id="svg-modal-close">&#215;</button>
      </div>
    </div>
    <div class="svg-modal-body">
      <pre id="svg-viewer-content"></pre>
    </div>
  </div>
</div>

<!-- Map Route Diagram (draggable floating panel) -->
<div id="map-diagram-panel">
  <div class="mdp-header" id="mdp-header">
    <div class="mdp-title" id="mdp-title"></div>
    <button class="svg-modal-close" id="mdp-close" style="color:#94a3b8;">&#215;</button>
  </div>
  <div class="mdp-body" id="mdp-content"></div>
</div>

<!-- PipeRun Diagram (draggable floating panel) -->
<div id="prd-modal">
  <div class="prd-header" id="prd-header">
    <div class="prd-title" id="prd-title"></div>
    <button class="svg-modal-close" id="prd-close" style="color:#94a3b8;">&#215;</button>
  </div>
  <div class="prd-body" id="prd-content"></div>
</div>

<script>
  const fileInput       = document.getElementById('file-input');
  const svgContainer    = document.getElementById('svg-container');
  const inspectorContent = document.getElementById('inspector-content');
  const hierarchyContent = document.getElementById('hierarchy-content');
  const piperunContent   = document.getElementById('piperun-content');
  const mapContent       = document.getElementById('map-content');

  // ── Sidebar Tab switching ──
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ── Selection mode (segmented control) ──
  function getSelectionMode() {
    const btn = document.querySelector('.seg-btn.active');
    return btn ? btn.dataset.mode : 'topmost';
  }

  document.querySelectorAll('.seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (activeSvgEl) renderHierarchy(activeSvgEl);
    });
  });


  let rawSvgString  = '';
  let currentSelectedId = null;
  let viewBoxState  = { x: 0, y: 0, width: 800, height: 600 };
  let isPanning     = false;
  let startPan      = { x: 0, y: 0 };
  let activeSvgEl   = null;
  let zoomPadFactor = 0.40;
  let zoomPadEnabled = true;

  // ── 줌 여백 슬라이더 + 토글 ──
  const padSlider = document.getElementById('pad-slider');
  const padVal    = document.getElementById('pad-val');
  const padToggle = document.getElementById('pad-toggle');

  function reZoomCurrent() {
    if (currentSelectedId) {
      const el = document.getElementById(currentSelectedId);
      if (el) zoomFitToElement(el);
    }
  }

  padToggle.addEventListener('click', () => {
    zoomPadEnabled = !zoomPadEnabled;
    padToggle.textContent = zoomPadEnabled ? 'ON' : 'OFF';
    padToggle.classList.toggle('off', !zoomPadEnabled);
    padSlider.disabled = !zoomPadEnabled;
    padVal.style.opacity = zoomPadEnabled ? '1' : '0.35';
    reZoomCurrent();
  });

  padSlider.addEventListener('input', () => {
    zoomPadFactor = padSlider.value / 100;
    padVal.textContent = padSlider.value + '%';
    reZoomCurrent();
  });

  // ── File load ──
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      rawSvgString = ev.target.result;
      processAndRenderSVG(rawSvgString);
    };
    reader.readAsText(file);
  });

  function processAndRenderSVG(svgStr) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(svgStr, 'image/svg+xml');
    const svgEl = doc.querySelector('svg');
    if (!svgEl) { alert('Invalid SVG file'); return; }

    svgEl.querySelectorAll('title, desc').forEach(t => t.remove());
    svgEl.querySelectorAll('*').forEach(el => el.removeAttribute('title'));

    Array.from(svgEl.children).forEach(child => {
      if (child.tagName.toLowerCase() === 'g') child.setAttribute('data-root-g', 'true');
    });

    let idCounter = 0;
    svgEl.querySelectorAll('*').forEach(el => {
      if (!el.id) el.id = `svg-el-${idCounter++}`;
    });

    svgEl.setAttribute('width',  '100%');
    svgEl.setAttribute('height', '100%');

    if (!svgEl.hasAttribute('viewBox')) {
      const w = parseFloat(svgEl.getAttribute('width'))  || 800;
      const h = parseFloat(svgEl.getAttribute('height')) || 600;
      viewBoxState = { x: 0, y: 0, width: w, height: h };
    } else {
      const vb = svgEl.getAttribute('viewBox').split(' ').map(Number);
      viewBoxState = { x: vb[0], y: vb[1], width: vb[2], height: vb[3] };
    }

    applyViewBox(svgEl);
    activeSvgEl = svgEl;

    svgContainer.innerHTML = '';
    svgContainer.appendChild(svgEl);

    renderHierarchy(svgEl);
    renderPipeRunTab(svgEl);
    renderMapTab();
  }

  // ── ViewBox / Zoom / Pan ──
  function applyViewBox(el) {
    el.setAttribute('viewBox', `${viewBoxState.x} ${viewBoxState.y} ${viewBoxState.width} ${viewBoxState.height}`);
  }

  function zoomFitToBBox(bbox) {
    if (!activeSvgEl || !bbox || (bbox.width === 0 && bbox.height === 0)) return;
    const pad = zoomPadEnabled ? Math.max(bbox.width, bbox.height) * zoomPadFactor : 0;
    const rect = svgContainer.getBoundingClientRect();
    const aspect = rect.width / rect.height;
    let fw = bbox.width  + pad * 2;
    let fh = bbox.height + pad * 2;
    if (fw / fh < aspect) fw = fh * aspect; else fh = fw / aspect;
    viewBoxState = {
      x: bbox.x + bbox.width  / 2 - fw / 2,
      y: bbox.y + bbox.height / 2 - fh / 2,
      width: fw, height: fh
    };
    applyViewBox(activeSvgEl);
  }

  function zoomFitToElement(el) {
    if (!activeSvgEl || !el) return;
    try { zoomFitToBBox(el.getBBox()); } catch(e) {}
  }

  function zoomFitToElements(els) {
    if (!activeSvgEl || !els.length) return;
    let combined = null;
    els.forEach(el => {
      try {
        const b = el.getBBox();
        if (b.width === 0 && b.height === 0) return;
        if (!combined) { combined = { x: b.x, y: b.y, x2: b.x + b.width, y2: b.y + b.height }; return; }
        combined.x  = Math.min(combined.x,  b.x);
        combined.y  = Math.min(combined.y,  b.y);
        combined.x2 = Math.max(combined.x2, b.x + b.width);
        combined.y2 = Math.max(combined.y2, b.y + b.height);
      } catch(e) {}
    });
    if (combined) zoomFitToBBox({ x: combined.x, y: combined.y, width: combined.x2 - combined.x, height: combined.y2 - combined.y });
  }

  svgContainer.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (!activeSvgEl) return;
    const factor = e.deltaY > 0 ? 1.1 : 0.9;
    const rect = svgContainer.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const vx = viewBoxState.x + (mx / rect.width)  * viewBoxState.width;
    const vy = viewBoxState.y + (my / rect.height) * viewBoxState.height;
    const nw = viewBoxState.width  * factor;
    const nh = viewBoxState.height * factor;
    viewBoxState = { x: vx - (mx / rect.width) * nw, y: vy - (my / rect.height) * nh, width: nw, height: nh };
    applyViewBox(activeSvgEl);
  });

  svgContainer.addEventListener('mousedown', (e) => {
    if (e.button === 1 || e.button === 2 || e.shiftKey) {
      e.preventDefault();
      isPanning = true;
      startPan = { x: e.clientX, y: e.clientY };
      svgContainer.style.cursor = 'grabbing';
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (!isPanning || !activeSvgEl) return;
    const dx = e.clientX - startPan.x;
    const dy = e.clientY - startPan.y;
    const rect = svgContainer.getBoundingClientRect();
    viewBoxState.x -= (dx / rect.width)  * viewBoxState.width;
    viewBoxState.y -= (dy / rect.height) * viewBoxState.height;
    startPan = { x: e.clientX, y: e.clientY };
    applyViewBox(activeSvgEl);
  });

  window.addEventListener('mouseup', () => {
    isPanning = false;
    svgContainer.style.cursor = 'crosshair';
  });

  svgContainer.addEventListener('contextmenu', e => e.preventDefault());

  // ── Hierarchy Rendering ──
  function renderHierarchy(svgEl) {
    hierarchyContent.innerHTML = '';
    const mode = getSelectionMode();

    function makeHierarchyItem(child, displayName) {
      const item  = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'hierarchy-item';
      title.textContent = displayName;
      title.dataset.elementId = child.id;
      title.addEventListener('click', (e) => { e.stopPropagation(); selectElementById(child.id, [], true); });
      item.appendChild(title);
      return { item, title };
    }

    function makeGroupItem(tagValue, elementId, collapsed = false, subtitle = '') {
      const item   = document.createElement('div');
      const title  = document.createElement('div');
      title.className = 'hierarchy-item';
      title.dataset.elementId = elementId;
      title.dataset.tag = tagValue.toLowerCase();
      const toggle = document.createElement('span');
      toggle.className = 'hg-toggle';
      toggle.textContent = collapsed ? '▶' : '▼';
      const inner = document.createElement('span');
      inner.style.cssText = 'flex:1;min-width:0;';
      const tagLbl = document.createElement('span');
      tagLbl.textContent = tagValue;
      inner.appendChild(tagLbl);
      if (subtitle) {
        const sub = document.createElement('span');
        sub.className = 'hi-subtitle';
        sub.textContent = subtitle;
        inner.appendChild(sub);
      }
      title.appendChild(toggle);
      title.appendChild(inner);
      item.appendChild(title);
      title.addEventListener('click', (e) => {
        e.stopPropagation();
        if (e.target === toggle) {
          const cc = item.querySelector(':scope > .hierarchy-children');
          if (cc) { const c = cc.classList.toggle('hg-collapsed'); toggle.textContent = c ? '▶' : '▼'; }
        } else {
          selectElementById(elementId, [], true);
        }
      });
      return item;
    }

    if (mode === 'joseon') {
      hierarchyContent.innerHTML = '<div class="empty-hint">조선 모드 계층화는<br>다음 빌드에서 구성됩니다.</div>';
      return;
    }

    if (mode === 'hayang') {
      // Tag <g>의 자식 요소 트리 구성 (기본 축소)
      function buildTagChildren(node, cont) {
        for (const child of Array.from(node.children)) {
          const t = child.tagName.toLowerCase();
          if (t === 'g') {
            const label = child.getAttribute('Tag') || (child.id ? `g [${child.id}]` : 'g');
            const gEl = makeGroupItem(label, child.id, true);
            const cc = document.createElement('div');
            cc.className = 'hierarchy-children hg-collapsed';
            buildTagChildren(child, cc);
            if (cc.children.length) gEl.appendChild(cc);
            cont.appendChild(gEl);
          } else {
            const dn = child.id ? `${child.tagName} [${child.id}]` : child.tagName;
            const { item } = makeHierarchyItem(child, dn);
            cont.appendChild(item);
          }
        }
      }

      // ItemType 섹션 헤더 (접기/펼치기)
      function makeItemTypeGroup(label) {
        const wrap = document.createElement('div');
        const head = document.createElement('div');
        head.className = 'it-group-head';
        const toggle = document.createElement('span');
        toggle.className = 'hg-toggle';
        toggle.textContent = '▶';
        const lbl = document.createElement('span');
        lbl.textContent = label;
        head.appendChild(toggle);
        head.appendChild(lbl);
        wrap.appendChild(head);
        head.addEventListener('click', () => {
          const cc = wrap.querySelector(':scope > .hierarchy-children');
          if (cc) { const c = cc.classList.toggle('hg-collapsed'); toggle.textContent = c ? '▶' : '▼'; }
        });
        return wrap;
      }

      // buildTagList로 <g Tag> 수집 + SmartLabel 연결 (형제 탐색 → BBox 보정)
      const tagObjects = buildTagList(svgEl);

      // ItemType 기준 그룹핑
      const byType = new Map();
      const noType = [];
      for (const obj of tagObjects) {
        const it = obj.attrs.ItemType;
        if (it) {
          if (!byType.has(it)) byType.set(it, []);
          byType.get(it).push(obj);
        } else {
          noType.push(obj);
        }
      }

      // 그룹 내 Tag값 내림차순 정렬
      const descByTag = (a, b) =>
        (b.attrs.Tag || '').localeCompare(a.attrs.Tag || '', undefined, { sensitivity: 'base' });

      // Tag 객체 하나를 하위 트리 포함하여 렌더링 (SmartLabel 라벨 서브타이틀 포함)
      function renderTagObj(obj, cont) {
        const gEl = makeGroupItem(obj.attrs.Tag || '', obj.attrs.id || '', true, obj.attrs._labels || '');
        const subCc = document.createElement('div');
        subCc.className = 'hierarchy-children hg-collapsed';
        buildTagChildren(obj.el, subCc);
        if (subCc.children.length) gEl.appendChild(subCc);
        cont.appendChild(gEl);
      }

      // ItemType 그룹 렌더링 (ItemType명 오름차순)
      [...byType.keys()].sort().forEach(itemType => {
        const objs = byType.get(itemType).sort(descByTag);
        const group = makeItemTypeGroup(itemType);
        const cc = document.createElement('div');
        cc.className = 'hierarchy-children hg-collapsed';

        if (itemType === 'PipeRun') {
          // 동일 Tag명 병합 — 클릭 시 해당 Tag의 모든 PipeRun 동시 하이라이트
          const mergedMap = new Map();
          objs.forEach(obj => {
            const tag = obj.attrs.Tag || '';
            if (!mergedMap.has(tag)) mergedMap.set(tag, []);
            mergedMap.get(tag).push(obj);
          });
          mergedMap.forEach((tagObjs, tag) => {
            const primary = tagObjs[0];
            const allIds  = tagObjs.map(o => o.attrs.id).filter(Boolean);
            const gEl = makeGroupItem(tag, primary.attrs.id || '', true, primary.attrs._labels || '');
            // 클릭 핸들러를 다중 선택으로 교체
            gEl.querySelector('.hierarchy-item').addEventListener('click', (e) => {
              const toggle = gEl.querySelector('.hg-toggle');
              if (e.target === toggle) return;  // 토글 클릭은 기존 처리에 위임
              e.stopPropagation();
              selectPipeRunGroup(allIds, tag, gEl.querySelector('.hierarchy-item'));
            }, true);  // capture=true로 기존 핸들러보다 먼저 실행
            const subCc = document.createElement('div');
            subCc.className = 'hierarchy-children hg-collapsed';
            tagObjs.forEach(obj => buildTagChildren(obj.el, subCc));
            if (subCc.children.length) gEl.appendChild(subCc);
            cc.appendChild(gEl);
          });
        } else {
          objs.forEach(obj => renderTagObj(obj, cc));
        }

        group.appendChild(cc);
        hierarchyContent.appendChild(group);
      });

      // Non-ItemType 마지막에 추가
      if (noType.length > 0) {
        noType.sort(descByTag);
        const group = makeItemTypeGroup('Non-ItemType');
        const cc = document.createElement('div');
        cc.className = 'hierarchy-children hg-collapsed';
        noType.forEach(obj => renderTagObj(obj, cc));
        group.appendChild(cc);
        hierarchyContent.appendChild(group);
      }

    }
  }

  // ── Click Handler ──
  svgContainer.addEventListener('click', (e) => {
    const mode = getSelectionMode();
    let target = e.target;
    let foundTarget = null;
    let domPath = [];

    while (target && target !== e.currentTarget && target.tagName.toLowerCase() !== 'svg') {
      domPath.unshift(target.tagName.toLowerCase() + (target.id ? `#${target.id}` : ''));
      if (target.getAttribute('data-root-g') === 'true') break;

      if (mode === 'hayang' && target.tagName.toLowerCase() === 'g' && getAttrCI(target, 'Tag') !== null) {
        foundTarget = target; break;
      }
      if (target.id) {
        if (mode === 'joseon') foundTarget = target;
        else if (mode === 'hayang' && !foundTarget) foundTarget = target;
      }
      target = target.parentElement;
    }

    document.querySelectorAll('[data-svg-selected="true"]').forEach(el => el.removeAttribute('data-svg-selected'));
    document.querySelectorAll('.hierarchy-item.active').forEach(el => el.classList.remove('active'));

    if (foundTarget) {
      e.stopPropagation();
      selectElementById(foundTarget.id, domPath);
    } else {
      inspectorContent.innerHTML = `<strong>DOM Path:</strong><br><span style="color:var(--text-3);font-size:12px;">${domPath.join(' › ')}</span><br><br><span style="color:#ef4444;">선택 모드에 맞는 요소를 찾을 수 없습니다.</span>`;
    }
  });

  // 사이드바 계층에서 tagNavId에 해당하는 항목을 찾아 펼치고 스크롤
  function navigateToTagInSidebar(tagNavId) {
    const searchInput = document.getElementById('sidebar-search');
    // 검색 중이라면 먼저 초기화하여 숨겨진 항목이 보이도록 함
    if (searchInput && searchInput.value.trim()) {
      searchInput.value = '';
      searchInput.dispatchEvent(new Event('input'));
    }

    const hItems = Array.from(hierarchyContent.querySelectorAll('.hierarchy-item[data-element-id]'));
    const hTarget = hItems.find(it => it.dataset.elementId === tagNavId);
    if (!hTarget) return;

    hTarget.classList.add('active');

    // 접혀 있는 모든 조상 hierarchy-children 펼치기
    let par = hTarget.parentElement;
    while (par && par.id !== 'hierarchy-content') {
      if (par.classList.contains('hierarchy-children') && par.classList.contains('hg-collapsed')) {
        par.classList.remove('hg-collapsed');
        const sib = par.previousElementSibling;
        if (sib) { const tog = sib.querySelector('.hg-toggle'); if (tog) tog.textContent = '▼'; }
      }
      par = par.parentElement;
    }

    // DOM 업데이트 후 스크롤 (display 변경이 적용된 뒤 실행)
    requestAnimationFrame(() => hTarget.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
  }

  // PipeRun 병합 그룹 전체 하이라이트 (동일 Tag명인 모든 요소를 함께 선택)
  function selectPipeRunGroup(ids, tagName, titleEl) {
    document.querySelectorAll('[data-svg-selected="true"]').forEach(el => el.removeAttribute('data-svg-selected'));
    document.querySelectorAll('.hierarchy-item.active').forEach(el => el.classList.remove('active'));
    if (titleEl) titleEl.classList.add('active');
    currentSelectedId = ids[0] || null;

    const els = ids.map(id => document.getElementById(id)).filter(Boolean);
    els.forEach(el => el.setAttribute('data-svg-selected', 'true'));
    zoomFitToElements(els);

    inspectorContent.innerHTML = `
      <strong>PipeRun (병합)</strong><br>
      <span style="color:var(--text-3);font-size:12px;">Tag: ${escHtml(tagName)}</span><br><br>
      <span style="font-size:13px;color:var(--text-2);">${els.length}개 요소가 함께 선택되었습니다.</span>
      <pre style="font-size:11px;color:var(--text-3);margin-top:8px;">${ids.map(id=>'#'+id).join('\n')}</pre>`;
  }

  function selectElementById(id, domPath = [], zoomFit = false) {
    if (!id) return;
    const foundTarget = document.getElementById(id);
    if (!foundTarget) return;

    document.querySelectorAll('[data-svg-selected="true"]').forEach(el => el.removeAttribute('data-svg-selected'));
    document.querySelectorAll('.hierarchy-item.active').forEach(el => el.classList.remove('active'));

    currentSelectedId = id;
    foundTarget.setAttribute('data-svg-selected', 'true');

    const props = {};
    for (const attr of foundTarget.attributes) {
      if (!['data-svg-selected','style','data-root-g'].includes(attr.name)) {
        props[attr.name] = attr.value;
      }
    }

    const pathHtml = domPath.length > 0
      ? `<strong>DOM Path:</strong><br><span style="color:var(--text-3);font-size:12px;">${domPath.join(' › ')}</span><br><br>`
      : '';
    inspectorContent.innerHTML = `${pathHtml}<strong>Element:</strong> ${foundTarget.tagName}<br><span style="color:var(--text-3);font-size:12px;">#${foundTarget.id}</span><br><br><strong>Attributes:</strong><pre>${JSON.stringify(props, null, 2)}</pre>`;

    // Tags탭: 선택 요소의 Tag <g> 조상을 찾아 탭 전환 + 경로 확장 + 스크롤
    let tagNavId = null;
    if (foundTarget.tagName.toLowerCase() === 'g' && getAttrCI(foundTarget, 'Tag') !== null) {
      tagNavId = id;
    } else {
      let anc = foundTarget.parentElement;
      while (anc && anc.tagName && anc.tagName.toLowerCase() !== 'svg') {
        if (anc.tagName.toLowerCase() === 'g' && getAttrCI(anc, 'Tag') !== null) {
          tagNavId = anc.id; break;
        }
        anc = anc.parentElement;
      }
    }

    if (tagNavId) {
      navigateToTagInSidebar(tagNavId);
    } else {
      // Tag 조상 없음: 현재 탭에서 일반 탐색
      const items = Array.from(document.querySelectorAll('.hierarchy-item'));
      const targetItem = items.find(it => it.dataset.elementId === id);
      if (targetItem) {
        targetItem.classList.add('active');
        targetItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    if (zoomFit) zoomFitToElement(foundTarget);
  }

  // ── SVG Text Viewer ──
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // span 없는 순수 텍스트 인덴트 포매터 — DOM 노드 생성 없음
  function formatSVGText(svgStr) {
    let depth = 0;
    const lines = [];
    for (const raw of svgStr.replace(/>\s*</g, '>\n<').trim().split('\n')) {
      const line = raw.trim();
      if (!line) continue;
      if (line.startsWith('</')) {
        depth = Math.max(0, depth - 1);
        lines.push('  '.repeat(depth) + line);
      } else if (line.startsWith('<') && !line.endsWith('/>') &&
                 !line.startsWith('<?') && !line.startsWith('<!') && !line.startsWith('<!--')) {
        lines.push('  '.repeat(depth) + line);
        depth++;
      } else {
        lines.push('  '.repeat(depth) + line);
      }
    }
    return lines.join('\n');
  }

  const svgViewerModal   = document.getElementById('svg-viewer-modal');
  const svgViewerContent = document.getElementById('svg-viewer-content');

  function closeSVGViewer() {
    svgViewerModal.classList.remove('open');
    // 닫을 때 즉시 DOM 비우기 — 수천 개 span 잔류로 인한 브라우저 멈춤 방지
    requestAnimationFrame(() => { svgViewerContent.textContent = ''; });
  }

  document.getElementById('svg-viewer-btn').addEventListener('click', () => {
    if (!rawSvgString) { alert('SVG 파일을 먼저 로드해주세요.'); return; }
    svgViewerModal.classList.add('open');
    // 모달이 열린 뒤 다음 프레임에서 렌더링 — 팝업 표시 지연 제거
    requestAnimationFrame(() => {
      svgViewerContent.textContent = formatSVGText(rawSvgString);
    });
  });

  document.getElementById('svg-modal-close').addEventListener('click', closeSVGViewer);

  document.getElementById('svg-viewer-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeSVGViewer();
  });

  document.getElementById('svg-copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(rawSvgString).then(() => {
      const btn = document.getElementById('svg-copy-btn');
      btn.textContent = '복사됨 ✓';
      setTimeout(() => { btn.textContent = '클립보드 복사'; }, 2000);
    });
  });

  // ── Tag List ──
  const INTERNAL_ATTRS = new Set(['data-svg-selected', 'data-root-g', 'data-pr-group', 'data-tag-group']);

  // 대소문자 구분 없이 속성값 반환 (XML SVG → HTML DOM 이동 시 속성명 케이스가 바뀔 수 있음)
  function getAttrCI(el, name) {
    const lo = name.toLowerCase();
    for (const a of el.attributes) {
      if (a.name.toLowerCase() === lo) return a.value;
    }
    return null;
  }

  // 알려진 속성명을 정규 케이스로 정규화 (tag→Tag, itemtype→ItemType 등)
  const ATTR_NORM = {
    tag: 'Tag', itemtype: 'ItemType', seq: 'Seq', name: 'Name',
    modelid: 'ModelID', drawingid: 'DrawingID', id: 'id'
  };

  function isSmartLabel(el) {
    if (el.tagName.toLowerCase() !== 'g') return false;
    const v = getAttrCI(el, 'Name');
    return v !== null && v.startsWith('Intergraph SmartLabel');
  }

  function extractLabelTexts(labelEl) {
    return [...new Set(
      Array.from(labelEl.querySelectorAll('text, tspan'))
        .map(t => t.textContent.trim()).filter(Boolean)
    )].join(' · ');
  }

  // buildTagList: <g Tag> 하나당 { attrs, children, el } 객체 반환
  function buildTagList(svgEl) {
    const tagObjects = [];
    const tagElMap   = new Map();  // el → tagObject (SmartLabel 연결용)

    function collectAttrs(el) {
      const attrs = {};
      for (const a of el.attributes) {
        if (!INTERNAL_ATTRS.has(a.name.toLowerCase())) {
          const key = ATTR_NORM[a.name.toLowerCase()] || a.name;
          attrs[key] = a.value;
        }
      }
      // el.id는 항상 DOM의 실제 id 속성값 (Id 대소문자 불일치 보정)
      if (el.id) attrs.id = el.id;
      return attrs;
    }

    // 직계 자식만 수집 (칩으로 표시)
    function collectDirectChildren(node) {
      return Array.from(node.children).map(c => ({
        _element: c.tagName.toLowerCase(),
        ...collectAttrs(c)
      }));
    }

    // Pass 1: 모든 <g Tag> 수집 — 깊이 무관, 모든 레벨에서 tagElMap 등록
    // (중첩된 <g Tag>도 형제 탐색 대상이 되도록 항상 재귀)
    function walkForTagGs(node) {
      for (const child of Array.from(node.children)) {
        if (child.tagName.toLowerCase() === 'g') {
          if (getAttrCI(child, 'Tag') !== null) {
            const obj = {
              attrs:    { ...collectAttrs(child) },
              children: collectDirectChildren(child),
              el:       child
            };
            tagObjects.push(obj);
            tagElMap.set(child, obj);
          }
          walkForTagGs(child);  // 항상 재귀 — <g Tag> 내부도 탐색
        }
      }
    }
    walkForTagGs(svgEl);

    // Pass 2: SmartLabel 연결 — 모든 깊이에서 SmartLabel 탐색
    // SmartLabel 발견 시 push 후에도 재귀 (SmartLabel 내부에 중첩 SmartLabel 없지만 일관성 유지)
    function findSmartLabels(node, result) {
      for (const child of Array.from(node.children)) {
        if (isSmartLabel(child)) result.push(child);
        findSmartLabels(child, result);  // 항상 재귀 — Tag <g> 내부도 탐색
      }
    }
    const smartLabels = [];
    findSmartLabels(svgEl, smartLabels);

    smartLabels.forEach(labelEl => {
      let linked = null;

      // 1순위: 바로 앞 형제 탐색
      const prev = labelEl.previousElementSibling;
      if (prev && prev.tagName.toLowerCase() === 'g' && getAttrCI(prev, 'Tag') !== null && tagElMap.has(prev)) {
        linked = tagElMap.get(prev);
      }

      // 2순위: BBox 교차 보정
      if (!linked) {
        try {
          const lb = labelEl.getBBox();
          let bestOverlap = 0;
          tagElMap.forEach((obj, el) => {
            try {
              const tb = el.getBBox();
              const ix = Math.max(0, Math.min(lb.x + lb.width,  tb.x + tb.width)  - Math.max(lb.x, tb.x));
              const iy = Math.max(0, Math.min(lb.y + lb.height, tb.y + tb.height) - Math.max(lb.y, tb.y));
              const ov = ix * iy;
              if (ov > bestOverlap) { bestOverlap = ov; linked = obj; }
            } catch(e) {}
          });
        } catch(e) {}
      }

      if (linked) {
        const texts = extractLabelTexts(labelEl);
        if (texts) linked.attrs._labels = texts;
      }
    });

    return tagObjects;
  }


  // ── 사이드바 Tag 검색 ──
  document.getElementById('sidebar-search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();

    if (!q) {
      // 검색 해제: 검색 중 숨긴 요소 모두 복원, 그룹 접기
      hierarchyContent.querySelectorAll('[data-sh]').forEach(el => {
        el.removeAttribute('data-sh');
        el.style.display = '';
      });
      hierarchyContent.querySelectorAll('.hierarchy-children').forEach(cc => {
        cc.classList.add('hg-collapsed');
      });
      return;
    }

    // 검색 활성: 모든 그룹 펼침
    hierarchyContent.querySelectorAll('.hierarchy-children').forEach(cc => cc.classList.remove('hg-collapsed'));

    // 개별 Tag 아이템 표시/숨김
    hierarchyContent.querySelectorAll('.hierarchy-item[data-element-id]').forEach(title => {
      const tag  = title.dataset.tag || '';
      const sub  = (title.querySelector('.hi-subtitle') || {}).textContent || '';
      const match = tag.includes(q) || sub.toLowerCase().includes(q);
      const wrapper = title.parentElement;
      if (match) {
        wrapper.removeAttribute('data-sh');
        wrapper.style.display = '';
      } else {
        wrapper.dataset.sh = '1';
        wrapper.style.display = 'none';
      }
    });

    // 표시할 자식이 없는 ItemType 그룹 숨김
    hierarchyContent.querySelectorAll(':scope > div').forEach(group => {
      const cc = group.querySelector(':scope > .hierarchy-children');
      if (!cc) return;
      const anyVisible = Array.from(cc.children).some(c => !c.dataset.sh);
      if (anyVisible) {
        group.removeAttribute('data-sh');
        group.style.display = '';
      } else {
        group.dataset.sh = '1';
        group.style.display = 'none';
      }
    });
  });

  // ── PipeRun Tab ──────────────────────────────────────────────────────────

  let _pipeRunTagObjects = null;  // 다이어그램 함수에서 재사용
  let _mapGraph = null;           // Map 경로 탐색용 그래프 캐시

  function renderPipeRunTab(svgEl) {
    piperunContent.innerHTML = '';
    piperunContent.className = 'tab-scroll-area';

    // 1. 모든 <g ItemType="PipeRun"> 수집
    const pipeRunEls = [];
    (function walk(node) {
      for (const child of Array.from(node.children)) {
        if (child.tagName.toLowerCase() === 'g' && getAttrCI(child, 'ItemType') === 'PipeRun') {
          pipeRunEls.push(child);
        }
        walk(child);
      }
    })(svgEl);

    if (!pipeRunEls.length) {
      piperunContent.innerHTML = '<div class="empty-hint">ItemType="PipeRun" 요소가<br>없습니다.</div>';
      return;
    }

    // 2. Tag명으로 그룹핑 (중복 허용 — 같은 Tag명 여러 개)
    const prMap = new Map();  // tagName → { els: [] }
    pipeRunEls.forEach(el => {
      const tag = getAttrCI(el, 'Tag') || el.id || '(unnamed)';
      if (!prMap.has(tag)) prMap.set(tag, { els: [] });
      prMap.get(tag).els.push(el);
    });

    // 3. buildTagList로 Tag 객체 수집 → Seq 속성으로 sub-tag 연결
    const tagObjects = buildTagList(svgEl);
    _pipeRunTagObjects = tagObjects;  // 다이어그램에서 재사용
    const seqItems = [];  // { obj, pipeRunName, sortOrder }
    tagObjects.forEach(obj => {
      const seq = obj.attrs.Seq || '';
      if (!seq || !seq.includes(':')) return;
      const ci = seq.lastIndexOf(':');
      const pipeRunName = seq.substring(0, ci).trim();
      const sortOrder   = parseInt(seq.substring(ci + 1), 10) || 0;
      if (prMap.has(pipeRunName)) seqItems.push({ obj, pipeRunName, sortOrder });
    });

    // 4. 최상위 PipeRun 이름 오름차순 정렬 후 렌더링
    [...prMap.keys()].sort().forEach(prName => {
      const { els } = prMap.get(prName);
      const subTags = seqItems
        .filter(s => s.pipeRunName === prName)
        .sort((a, b) => a.sortOrder - b.sortOrder);  // 오름차순

      // 최상위 아이템 전체 요소 ID 수집 (하이라이트용)
      const allEls = [
        ...els,
        ...subTags.map(s => s.obj.el).filter(Boolean)
      ];

      // ── 최상위 PipeRun 헤더 ──
      const topWrap = document.createElement('div');
      const topHead = document.createElement('div');
      topHead.className = 'pr-top-item';

      const toggle = document.createElement('span');
      toggle.className = 'hg-toggle';
      toggle.textContent = '▶';
      const nameSpan = document.createElement('span');
      nameSpan.style.cssText = 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
      nameSpan.textContent = prName;
      const diagBtn = document.createElement('button');
      diagBtn.className = 'pr-diagram-btn';
      diagBtn.textContent = '⊞ 다이어그램';
      diagBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        // subTags에서 ItemType='PipeRun' 제외한 순서 배열 전달
        const diagramItems = subTags.filter(s => s.obj.attrs.ItemType !== 'PipeRun');
        openPipeRunDiagram(prName, diagramItems);
      });

      topHead.appendChild(toggle);
      topHead.appendChild(nameSpan);
      topHead.appendChild(diagBtn);
      topWrap.appendChild(topHead);

      // 클릭: 토글 ▶/▼ 또는 전체 하이라이트
      topHead.addEventListener('click', (e) => {
        if (e.target === toggle) {
          const cc = topWrap.querySelector(':scope > .hierarchy-children');
          if (cc) { const c = cc.classList.toggle('hg-collapsed'); toggle.textContent = c ? '▶' : '▼'; }
          return;
        }
        selectPipeRunTopLevel(prName, allEls, topHead);
      });

      // ── 하위 컨테이너 ──
      const childrenWrap = document.createElement('div');
      childrenWrap.className = 'hierarchy-children hg-collapsed';

      // ── Sub-PipeRuns (중복 인스턴스가 2개 이상일 때만) ──
      if (els.length > 1) {
        const subPRHead = makePrSubHead('Sub-PipeRuns (' + els.length + ')');
        childrenWrap.appendChild(subPRHead.wrap);
        els.forEach(el => {
          const leaf = document.createElement('div');
          leaf.className = 'pr-leaf';
          leaf.textContent = getAttrCI(el, 'Tag') || el.id;
          const idBadge = document.createElement('span');
          idBadge.className = 'pr-seq-badge';
          idBadge.textContent = '#' + (el.id || '');
          leaf.appendChild(idBadge);
          leaf.addEventListener('click', (e) => { e.stopPropagation(); selectPRLeaf(el, leaf); });
          subPRHead.cc.appendChild(leaf);
        });
      }

      // ── Sub-Tags ──
      if (subTags.length) {
        const subTagHead = makePrSubHead('Sub-Tags (' + subTags.length + ')');
        childrenWrap.appendChild(subTagHead.wrap);
        subTags.forEach(({ obj, sortOrder }) => {
          const leaf = document.createElement('div');
          leaf.className = 'pr-leaf';
          leaf.textContent = obj.attrs.Tag || obj.attrs.id || '';
          const badge = document.createElement('span');
          badge.className = 'pr-seq-badge';
          badge.textContent = '·' + sortOrder;
          leaf.appendChild(badge);
          leaf.addEventListener('click', (e) => { e.stopPropagation(); selectPRLeaf(obj.el, leaf); });
          subTagHead.cc.appendChild(leaf);
        });
      }

      if (childrenWrap.children.length) topWrap.appendChild(childrenWrap);
      piperunContent.appendChild(topWrap);
    });
  }

  // Sub 섹션 헤더 헬퍼 (▶/▼ 토글 포함)
  function makePrSubHead(label) {
    const wrap = document.createElement('div');
    const head = document.createElement('div');
    head.className = 'pr-sub-head';
    const tog = document.createElement('span');
    tog.className = 'hg-toggle'; tog.textContent = '▶';
    head.appendChild(tog);
    head.appendChild(document.createTextNode(label));
    const cc = document.createElement('div');
    cc.className = 'hierarchy-children hg-collapsed';
    wrap.appendChild(head);
    wrap.appendChild(cc);
    head.addEventListener('click', () => {
      const c = cc.classList.toggle('hg-collapsed'); tog.textContent = c ? '▶' : '▼';
    });
    return { wrap, cc };
  }

  // 단일 리프 요소 선택
  function selectPRLeaf(el, leafEl) {
    if (!el) return;
    document.querySelectorAll('[data-svg-selected="true"]').forEach(e => e.removeAttribute('data-svg-selected'));
    document.querySelectorAll('.hierarchy-item.active, .pr-top-item.active, .pr-leaf.active')
      .forEach(e => e.classList.remove('active'));
    leafEl.classList.add('active');
    currentSelectedId = el.id;
    el.setAttribute('data-svg-selected', 'true');
    zoomFitToElement(el);
    const props = {};
    for (const a of el.attributes) {
      if (!['data-svg-selected','style','data-root-g'].includes(a.name)) props[a.name] = a.value;
    }
    inspectorContent.innerHTML = `<strong>Element:</strong> ${el.tagName}<br><span style="color:var(--text-3);font-size:12px;">#${el.id}</span><br><br><strong>Attributes:</strong><pre>${JSON.stringify(props, null, 2)}</pre>`;
  }

  // ── Map Tab ───────────────────────────────────────────────────────────────

  function buildMapGraph() {
    if (!_pipeRunTagObjects) return null;
    const seqItems = [];
    _pipeRunTagObjects.forEach(obj => {
      const seq = obj.attrs.Seq || '';
      if (!seq.includes(':') || obj.attrs.ItemType === 'PipeRun') return;
      const ci = seq.lastIndexOf(':');
      const pipeRunName = seq.substring(0, ci).trim();
      const sortOrder   = parseInt(seq.substring(ci + 1), 10) || 0;
      const tagName = obj.attrs.Tag || obj.attrs.id || '';
      if (!tagName) return;
      seqItems.push({ tagName, pipeRunName, sortOrder, obj, nodeId: seqItems.length });
    });

    const prGroups = new Map();
    seqItems.forEach(item => {
      if (!prGroups.has(item.pipeRunName)) prGroups.set(item.pipeRunName, []);
      prGroups.get(item.pipeRunName).push(item);
    });
    prGroups.forEach(items => items.sort((a, b) => a.sortOrder - b.sortOrder));

    const tagToNodes = new Map();
    seqItems.forEach(item => {
      if (!tagToNodes.has(item.tagName)) tagToNodes.set(item.tagName, []);
      tagToNodes.get(item.tagName).push(item.nodeId);
    });

    const adj = new Map();
    seqItems.forEach(item => adj.set(item.nodeId, []));

    // 같은 PipeRun 내 연속 아이템 — 흐름 방향(오름차순)으로만 연결 (단방향)
    prGroups.forEach(items => {
      for (let i = 0; i < items.length - 1; i++) {
        adj.get(items[i].nodeId).push(items[i+1].nodeId);  // 순방향만
      }
    });

    // 다른 PipeRun에 동일 Tag명 → 접합점 연결
    tagToNodes.forEach(ids => {
      for (let i = 0; i < ids.length; i++)
        for (let j = i + 1; j < ids.length; j++) {
          adj.get(ids[i]).push(ids[j]);
          adj.get(ids[j]).push(ids[i]);
        }
    });

    return { seqItems, tagToNodes, adj };
  }

  function findMapPath(fromTag, toTag) {
    const g = _mapGraph;
    if (!g) return null;
    const startIds = g.tagToNodes.get(fromTag) || [];
    const endSet   = new Set(g.tagToNodes.get(toTag) || []);
    if (!startIds.length || !endSet.size) return null;

    const visited = new Set();
    const queue   = [];
    startIds.forEach(id => { queue.push([id]); visited.add(id); });

    while (queue.length) {
      const path = queue.shift();
      const cur  = path[path.length - 1];
      if (endSet.has(cur)) return path.map(id => g.seqItems[id]);
      for (const next of (g.adj.get(cur) || [])) {
        if (!visited.has(next)) { visited.add(next); queue.push([...path, next]); }
      }
    }
    return null;
  }

  function renderMapTab() {
    _mapGraph = buildMapGraph();
    const tagList = document.getElementById('map-tag-list');
    tagList.innerHTML = '';
    document.getElementById('map-status').textContent = '';
    document.getElementById('map-status').className = 'map-status';
    mapContent.innerHTML = '';
    if (!_mapGraph) return;
    [..._mapGraph.tagToNodes.keys()].sort().forEach(tag => {
      const opt = document.createElement('option');
      opt.value = tag;
      tagList.appendChild(opt);
    });
  }

  document.getElementById('map-find-btn').addEventListener('click', () => {
    const fromTag  = document.getElementById('map-from').value.trim();
    const toTag    = document.getElementById('map-to').value.trim();
    const statusEl = document.getElementById('map-status');

    if (!fromTag || !toTag) {
      statusEl.textContent = 'From과 To를 모두 입력하세요.';
      statusEl.className = 'map-status error'; return;
    }
    if (fromTag === toTag) {
      statusEl.textContent = 'From과 To가 동일합니다.';
      statusEl.className = 'map-status error'; return;
    }
    if (!_mapGraph) {
      statusEl.textContent = 'SVG 파일을 먼저 로드하세요.';
      statusEl.className = 'map-status error'; return;
    }

    const path = findMapPath(fromTag, toTag);
    if (!path) {
      statusEl.textContent = `"${fromTag}" → "${toTag}" 경로 없음`;
      statusEl.className = 'map-status error'; return;
    }

    statusEl.textContent = `경로 발견 (${path.length}개 노드)`;
    statusEl.className = 'map-status success';
    highlightMapPath(path);
    openMapDiagram(fromTag, toTag, path);
  });

  function highlightMapPath(path) {
    document.querySelectorAll('[data-svg-selected="true"]').forEach(e => e.removeAttribute('data-svg-selected'));
    document.querySelectorAll('.hierarchy-item.active, .pr-top-item.active, .pr-leaf.active')
      .forEach(e => e.classList.remove('active'));

    const domEls = [];
    const seenTags = new Set();
    const usedPRNames = new Set();

    path.forEach(node => {
      usedPRNames.add(node.pipeRunName);
      if (!seenTags.has(node.tagName) && node.obj.el) {
        seenTags.add(node.tagName);
        domEls.push(node.obj.el);
      }
    });

    // 경로에 사용된 PipeRun 파이프 세그먼트도 하이라이트
    if (_pipeRunTagObjects) {
      _pipeRunTagObjects.forEach(obj => {
        if (obj.attrs.ItemType === 'PipeRun' && usedPRNames.has(obj.attrs.Tag) && obj.el)
          domEls.push(obj.el);
      });
    }

    domEls.forEach(el => el.setAttribute('data-svg-selected', 'true'));
    zoomFitToElements(domEls);
  }

  // ── Map 경로 다이어그램 ───────────────────────────────────────────────────

  function openMapDiagram(fromTag, toTag, path) {
    const NW = 110, NH = 34;
    const HS = 150;
    const ML = 60, MR = 80;
    const CY = 105;
    const H  = 175;

    const trunc = (s, n=14) => s.length > n ? s.slice(0, n-1) + '…' : s;
    const esc   = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    // 연속 동일 Tag 중복 제거 (PipeRun 접합점 처리)
    const steps = [];
    path.forEach(node => {
      const last = steps[steps.length - 1];
      if (last && last.tagName === node.tagName) {
        last.exitPR = node.pipeRunName;
      } else {
        steps.push({ tagName: node.tagName, itemType: node.obj?.attrs?.ItemType || '',
          pipeRunName: node.pipeRunName, exitPR: node.pipeRunName });
      }
    });

    const W = steps.length > 0 ? ML + steps.length * HS + MR : 320;
    const parts = [];

    parts.push(`<rect width="${W}" height="${H}" fill="#0f172a" rx="12"/>`);
    parts.push(`<text x="${W/2}" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#fbbf24" font-family="Arial,sans-serif">${esc(trunc(fromTag,20))} → ${esc(trunc(toTag,20))}</text>`);

    if (steps.length === 0) {
      parts.push(`<text x="${W/2}" y="${H/2+6}" text-anchor="middle" font-size="14" fill="#475569" font-family="Arial,sans-serif">경로 없음</text>`);
    } else {
      // 화살표 + PipeRun 레이블
      steps.forEach((step, i) => {
        if (i === steps.length - 1) return;
        const x1 = ML + i * HS + NW / 2;
        const x2 = ML + (i + 1) * HS - NW / 2;
        const mx  = (x1 + x2) / 2;
        const nextStep = steps[i + 1];
        const prChanged = step.exitPR !== nextStep.pipeRunName;
        const clr = prChanged ? '#f59e0b' : '#475569';
        parts.push(`<line x1="${x1}" y1="${CY}" x2="${x2}" y2="${CY}" stroke="${clr}" stroke-width="1.5"/>`);
        parts.push(`<polygon points="${x2},${CY} ${x2-9},${CY-4} ${x2-9},${CY+4}" fill="${clr}"/>`);
        if (step.exitPR) {
          parts.push(`<text x="${mx}" y="${CY-NH/2-15}" text-anchor="middle" font-size="8" fill="${prChanged ? '#f59e0b' : '#64748b'}" font-family="Arial,sans-serif">${esc(trunc(step.exitPR,16))}</text>`);
        }
      });

      // 노드 박스
      steps.forEach((step, i) => {
        const cx = ML + i * HS;
        parts.push(`<rect x="${cx-NW/2}" y="${CY-NH/2}" width="${NW}" height="${NH}" rx="7" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>`);
        parts.push(`<text x="${cx}" y="${CY+5}" text-anchor="middle" font-size="11" fill="#bfdbfe" font-family="Arial,sans-serif">${esc(trunc(step.tagName))}</text>`);
        if (step.itemType) {
          parts.push(`<text x="${cx}" y="${CY-NH/2-5}" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial,sans-serif">${esc(step.itemType)}</text>`);
        }
        parts.push(`<text x="${cx}" y="${CY+NH/2+12}" text-anchor="middle" font-size="8" fill="#475569" font-family="Arial,sans-serif">${esc(trunc(step.pipeRunName,16))}</text>`);
      });
    }

    document.getElementById('mdp-title').textContent = fromTag + ' → ' + toTag;
    document.getElementById('mdp-content').innerHTML =
      `<div style="overflow:auto;padding:4px 0;"><svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;min-width:${W}px;">${parts.join('')}</svg></div>`;
    const panel = document.getElementById('map-diagram-panel');
    panel.style.left = '';
    panel.style.top = '';
    panel.style.transform = '';
    panel.classList.add('open');
  }

  // mdp 닫기 + 드래그
  document.getElementById('mdp-close').addEventListener('click', () => {
    document.getElementById('map-diagram-panel').classList.remove('open');
    document.getElementById('mdp-content').innerHTML = '';
  });

  (function () {
    const panel  = document.getElementById('map-diagram-panel');
    const header = document.getElementById('mdp-header');
    let drag = false, ox = 0, oy = 0, pl = 0, pt = 0;

    header.addEventListener('mousedown', e => {
      if (e.target.closest('.svg-modal-close')) return;
      drag = true;
      const r = panel.getBoundingClientRect();
      ox = e.clientX; oy = e.clientY;
      pl = r.left;    pt = r.top;
      panel.style.transform = 'none';
      panel.style.left = pl + 'px';
      panel.style.top  = pt + 'px';
      e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!drag) return;
      panel.style.left = (pl + e.clientX - ox) + 'px';
      panel.style.top  = (pt + e.clientY - oy) + 'px';
    });
    document.addEventListener('mouseup', () => { drag = false; });
  })();

  // ── PipeRun Sequential Diagram ───────────────────────────────────────────

  function openPipeRunDiagram(prName, items) {
    const NW = 110, NH = 34;   // 노드 박스 크기
    const HS = 150;             // 수평 간격
    const ML = 60, MR = 80;    // 좌우 마진
    const TY = 38;              // 제목 y
    const CY = 110;             // 노드 중심 y (고정)
    const H  = 180;

    const trunc = (s, n=14) => s.length > n ? s.slice(0, n-1) + '…' : s;
    const esc   = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    const W = items.length > 0 ? ML + items.length * HS + MR : 320;
    const parts = [];

    parts.push(`<rect width="${W}" height="${H}" fill="#0f172a" rx="12"/>`);
    parts.push(`<text x="${W/2}" y="${TY}" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24" font-family="Arial,sans-serif" letter-spacing=".3">${esc(prName)}</text>`);

    if (items.length === 0) {
      parts.push(`<text x="${W/2}" y="${H/2+6}" text-anchor="middle" font-size="14" fill="#475569" font-family="Arial,sans-serif">Sub-Tags 없음</text>`);
    } else {
      // 화살표 연결선
      items.forEach((item, i) => {
        if (i === items.length - 1) return;
        const x1 = ML + i * HS + NW / 2;
        const x2 = ML + (i + 1) * HS - NW / 2;
        parts.push(`<line x1="${x1}" y1="${CY}" x2="${x2}" y2="${CY}" stroke="#334155" stroke-width="1.5"/>`);
        const ax = x2;
        parts.push(`<polygon points="${ax},${CY} ${ax-9},${CY-4} ${ax-9},${CY+4}" fill="#334155"/>`);
      });

      // 노드 박스
      items.forEach((item, i) => {
        const cx = ML + i * HS;
        const tag      = item.obj.attrs.Tag || item.obj.attrs.id || '?';
        const itemType = item.obj.attrs.ItemType || '';
        const seq      = item.obj.attrs.Seq || '';
        const ci = seq.lastIndexOf(':');
        const seqNum = ci >= 0 ? seq.substring(ci + 1) : '';

        parts.push(`<rect x="${cx-NW/2}" y="${CY-NH/2}" width="${NW}" height="${NH}" rx="7" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>`);
        parts.push(`<text x="${cx}" y="${CY+5}" text-anchor="middle" font-size="11" fill="#bfdbfe" font-family="Arial,sans-serif">${esc(trunc(tag))}</text>`);
        if (itemType) {
          parts.push(`<text x="${cx}" y="${CY-NH/2-5}" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial,sans-serif">${esc(itemType)}</text>`);
        }
        if (seqNum) {
          parts.push(`<text x="${cx}" y="${CY+NH/2+12}" text-anchor="middle" font-size="8" fill="#475569" font-family="Arial,sans-serif">Seq·${esc(seqNum)}</text>`);
        }
      });
    }

    document.getElementById('prd-title').textContent = prName;
    document.getElementById('prd-content').innerHTML =
      `<div style="overflow:auto;padding:8px 0;"><svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;min-width:${W}px;">${parts.join('')}</svg></div>`;
    const prdPanel = document.getElementById('prd-modal');
    prdPanel.style.left = '';
    prdPanel.style.top = '';
    prdPanel.style.transform = '';
    prdPanel.classList.add('open');
  }

  // PipeRun 다이어그램 패널 닫기 + 드래그
  document.getElementById('prd-close').addEventListener('click', () => {
    document.getElementById('prd-modal').classList.remove('open');
    document.getElementById('prd-content').innerHTML = '';
  });

  (function () {
    const panel  = document.getElementById('prd-modal');
    const header = document.getElementById('prd-header');
    let drag = false, ox = 0, oy = 0, pl = 0, pt = 0;
    header.addEventListener('mousedown', e => {
      if (e.target.closest('.svg-modal-close')) return;
      drag = true;
      const r = panel.getBoundingClientRect();
      ox = e.clientX; oy = e.clientY;
      pl = r.left;    pt = r.top;
      panel.style.transform = 'none';
      panel.style.left = pl + 'px';
      panel.style.top  = pt + 'px';
      e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!drag) return;
      panel.style.left = (pl + e.clientX - ox) + 'px';
      panel.style.top  = (pt + e.clientY - oy) + 'px';
    });
    document.addEventListener('mouseup', () => { drag = false; });
  })();

  // 최상위 PipeRun 선택 — 모든 하위 요소 동시 하이라이트
  function selectPipeRunTopLevel(prName, allEls, titleEl) {
    document.querySelectorAll('[data-svg-selected="true"]').forEach(e => e.removeAttribute('data-svg-selected'));
    document.querySelectorAll('.hierarchy-item.active, .pr-top-item.active, .pr-leaf.active')
      .forEach(e => e.classList.remove('active'));
    titleEl.classList.add('active');
    currentSelectedId = allEls[0] ? allEls[0].id : null;
    const domEls = allEls.filter(Boolean);
    domEls.forEach(el => el.setAttribute('data-svg-selected', 'true'));
    zoomFitToElements(domEls);
    inspectorContent.innerHTML = `
      <strong>PipeRun</strong><br>
      <span style="color:var(--text-3);font-size:12px;">${escHtml(prName)}</span><br><br>
      <span style="font-size:13px;color:var(--text-2);">${domEls.length}개 요소 선택됨</span>
      <pre style="font-size:11px;color:var(--text-3);margin-top:8px;">${domEls.map(e=>'#'+e.id).join('\n')}</pre>`;
  }
</script>
