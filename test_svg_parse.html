<!DOCTYPE html>
<html>
<head>
<title>SVG Parsing & Selection Test</title>
<style>
  body { font-family: sans-serif; display: flex; gap: 20px; padding: 20px; height: 100vh; margin: 0; box-sizing: border-box; }
  #svg-container { flex: 1; border: 1px solid #ccc; background: #f9f9f9; padding: 10px; cursor: crosshair; overflow: hidden; display: flex; }
  #hierarchy { width: 300px; border: 1px solid #ccc; padding: 10px; background: #fff; overflow-y: auto; font-size: 12px; }
  #inspector { width: 300px; border: 1px solid #ccc; padding: 10px; background: #fff; overflow-y: auto; }
  pre { background: #eee; padding: 10px; white-space: pre-wrap; word-wrap: break-word; font-size: 12px; }
  [data-svg-selected="true"], [data-svg-selected="true"] * { stroke: blue !important; stroke-width: 0.5px !important; }
  .hierarchy-item { cursor: pointer; padding: 2px 5px; margin-bottom: 2px; border-radius: 3px; }
  .hierarchy-item:hover { background-color: #e0e7ff; }
  .hierarchy-item.active { background-color: #c7d2fe; font-weight: bold; color: #3730a3; }
  .hierarchy-children { margin-left: 15px; border-left: 1px dashed #cbd5e1; padding-left: 5px; }

  /* SVG Viewer Modal */
  .svg-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:9999; align-items:center; justify-content:center; }
  .svg-modal.open { display:flex; }
  .svg-modal-box { background:#1e1e1e; border-radius:8px; width:88%; height:88%; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,.6); }
  .svg-modal-header { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; background:#2d2d2d; flex-shrink:0; }
  .svg-modal-header h3 { margin:0; color:#fff; font-size:13px; }
  .svg-modal-actions { display:flex; gap:8px; align-items:center; }
  .svg-modal-action-btn { background:#3c3c3c; color:#ccc; border:none; padding:4px 12px; border-radius:4px; cursor:pointer; font-size:12px; }
  .svg-modal-action-btn:hover { background:#505050; color:#fff; }
  .svg-modal-close { background:none; border:none; color:#aaa; font-size:24px; cursor:pointer; line-height:1; padding:0 4px; }
  .svg-modal-close:hover { color:#fff; }
  .svg-modal-body { flex:1; overflow:auto; padding:16px; }
  .svg-modal-body pre { margin:0; font-family:'Consolas','Courier New',monospace; font-size:12px; line-height:1.7; white-space:pre; }
  .sv-bracket { color:#808080; }
  .sv-tag     { color:#4ec9b0; }
  .sv-attr    { color:#9cdcfe; }
  .sv-val     { color:#ce9178; }
  .sv-text    { color:#d4d4d4; font-style:italic; }
  .sv-comment { color:#6a9955; }
</style>
</head>
<body>

<div id="hierarchy">
  <h3>Hierarchy</h3>
  <div id="hierarchy-content" style="color: #888; font-style: italic;">Load an SVG to see its structure.</div>
</div>

<div style="display:flex; flex-direction: column; flex: 1;">
  <div style="margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;">
    <div>
      <input type="file" id="file-input" accept=".svg" />
      <p style="font-size: 12px; color: #666;">Choose your SVG file here. Click on any element in the image below to test selection.</p>
      <button id="svg-viewer-btn" style="font-size:12px; padding:5px 12px; cursor:pointer; background:#334155; color:#fff; border:none; border-radius:4px;">SVG 텍스트 뷰어 보기</button>
    </div>

    <div style="font-size: 12px; padding: 10px; background: #eee; border: 1px solid #ccc; border-radius: 4px;">
      <strong>Selection Mode (객체화 단위 조절):</strong><br/>
      <label><input type="radio" name="selectionMode" value="topmost" checked> Topmost Group (최상위 &lt;g&gt; 기준)</label><br/>
      <label><input type="radio" name="selectionMode" value="exact"> Exact Element (클릭된 단일 객체)</label><br/>
      <label><input type="radio" name="selectionMode" value="name_attr"> Group by 'Tag' Attribute (Tag 속성 그룹화)</label>
    </div>
  </div>
  <div id="svg-container">
     <!-- SVG will be injected here -->
  </div>
</div>

<div id="inspector">
  <h3>Selected Object</h3>
  <div id="inspector-content">Click an object to view its properties.</div>
</div>

<script>
  const fileInput = document.getElementById('file-input');
  const svgContainer = document.getElementById('svg-container');
  const inspectorContent = document.getElementById('inspector-content');
  const hierarchyContent = document.getElementById('hierarchy-content');
  let rawSvgString = '';
  let currentSelectedId = null;
  let viewBoxState = { x: 0, y: 0, width: 800, height: 600 };
  let isPanning = false;
  let startPan = { x: 0, y: 0 };
  let activeSvgEl = null;

  // Re-render hierarchy when selection mode changes
  document.querySelectorAll('input[name="selectionMode"]').forEach(radio => {
      radio.addEventListener('change', () => {
          if (activeSvgEl) renderHierarchy(activeSvgEl);
      });
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      rawSvgString = event.target.result;
      processAndRenderSVG(rawSvgString);
    };
    reader.readAsText(file);
  });

  function processAndRenderSVG(rawSvgString) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(rawSvgString, 'image/svg+xml');
    const svgEl = doc.querySelector('svg');

    if (!svgEl) {
      alert("Invalid SVG file");
      return;
    }

    // 1. Remove title and desc to prevent tooltips
    const titles = svgEl.querySelectorAll('title, desc');
    titles.forEach(t => t.remove());

    // Also remove title attributes
    const allElements = svgEl.querySelectorAll('*');
    allElements.forEach(el => el.removeAttribute('title'));

    // 2. Mark root elements
    Array.from(svgEl.children).forEach(child => {
      if (child.tagName.toLowerCase() === 'g') {
        child.setAttribute('data-root-g', 'true');
      }
    });

    // 3. Assign missing IDs
    let idCounter = 0;
    allElements.forEach(el => {
      if (!el.id) {
        el.id = `svg-imported-el-${idCounter++}`;
      }
    });

    // 4. Render
    svgContainer.innerHTML = '';

    // Set width and height to 100% to fill the container
    svgEl.setAttribute('width', '100%');
    svgEl.setAttribute('height', '100%');

    // Ensure viewBox exists so it scales properly instead of clipping
    if (!svgEl.hasAttribute('viewBox')) {
        const w = svgEl.getAttribute('width') || 800;
        const h = svgEl.getAttribute('height') || 600;
        viewBoxState = { x: 0, y: 0, width: parseFloat(w), height: parseFloat(h) };
    } else {
        const vb = svgEl.getAttribute('viewBox').split(' ').map(Number);
        viewBoxState = { x: vb[0], y: vb[1], width: vb[2], height: vb[3] };
    }

    applyViewBox(svgEl);
    activeSvgEl = svgEl;

    // Append the processed SVG element directly
    svgContainer.appendChild(svgEl);

    // Generate Hierarchy
    renderHierarchy(svgEl);
  }

  // --- View Control Features (Zoom / Pan) ---

  function applyViewBox(el) {
      el.setAttribute('viewBox', `${viewBoxState.x} ${viewBoxState.y} ${viewBoxState.width} ${viewBoxState.height}`);
  }

  function zoomFitToElement(el) {
      if (!activeSvgEl || !el) return;
      try {
          const bbox = el.getBBox();
          if (bbox.width === 0 && bbox.height === 0) return;
          const padding = Math.max(bbox.width, bbox.height) * 0.15;
          const containerRect = svgContainer.getBoundingClientRect();
          const containerAspect = containerRect.width / containerRect.height;
          let fitWidth = bbox.width + padding * 2;
          let fitHeight = bbox.height + padding * 2;
          if (fitWidth / fitHeight < containerAspect) {
              fitWidth = fitHeight * containerAspect;
          } else {
              fitHeight = fitWidth / containerAspect;
          }
          viewBoxState = {
              x: bbox.x + bbox.width / 2 - fitWidth / 2,
              y: bbox.y + bbox.height / 2 - fitHeight / 2,
              width: fitWidth,
              height: fitHeight
          };
          applyViewBox(activeSvgEl);
      } catch(e) {}
  }

  svgContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (!activeSvgEl) return;

      const zoomFactor = e.deltaY > 0 ? 1.1 : 0.9;
      const rect = svgContainer.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const viewX = viewBoxState.x + (mouseX / rect.width) * viewBoxState.width;
      const viewY = viewBoxState.y + (mouseY / rect.height) * viewBoxState.height;

      const newWidth = viewBoxState.width * zoomFactor;
      const newHeight = viewBoxState.height * zoomFactor;

      viewBoxState = {
          x: viewX - (mouseX / rect.width) * newWidth,
          y: viewY - (mouseY / rect.height) * newHeight,
          width: newWidth,
          height: newHeight
      };

      applyViewBox(activeSvgEl);
  });

  svgContainer.addEventListener('mousedown', (e) => {
      // Only pan on middle or right click, or if holding shift/alt
      if (e.button === 1 || e.button === 2 || e.shiftKey) {
          e.preventDefault();
          isPanning = true;
          startPan = { x: e.clientX, y: e.clientY };
          svgContainer.style.cursor = 'grabbing';
      }
  });

  window.addEventListener('mousemove', (e) => {
      if (!isPanning || !activeSvgEl) return;

      const dx = e.clientX - startPan.x;
      const dy = e.clientY - startPan.y;
      const rect = svgContainer.getBoundingClientRect();

      const viewDx = (dx / rect.width) * viewBoxState.width;
      const viewDy = (dy / rect.height) * viewBoxState.height;

      viewBoxState.x -= viewDx;
      viewBoxState.y -= viewDy;

      startPan = { x: e.clientX, y: e.clientY };
      applyViewBox(activeSvgEl);
  });

  window.addEventListener('mouseup', () => {
      isPanning = false;
      svgContainer.style.cursor = 'crosshair';
  });

  svgContainer.addEventListener('contextmenu', e => e.preventDefault());

  // --- Hierarchy Rendering ---
  function renderHierarchy(svgEl) {
      hierarchyContent.innerHTML = '';
      const selectionMode = document.querySelector('input[name="selectionMode"]:checked').value;

      function makeHierarchyItem(child, displayName) {
          const item = document.createElement('div');
          const title = document.createElement('div');
          title.className = 'hierarchy-item';
          title.textContent = displayName;
          title.dataset.elementId = child.id;
          title.addEventListener('click', (e) => {
              e.stopPropagation();
              selectElementById(child.id, [], true);
          });
          item.appendChild(title);
          return { item, title };
      }

      function buildTree(node, container) {
          Array.from(node.children).forEach(child => {
              const tag = child.tagName.toLowerCase();

              if (selectionMode === 'topmost') {
                  if (tag === 'g' && child.parentElement === svgEl) {
                      const nameAttr = child.getAttribute('name') || child.getAttribute('Name') || child.id;
                      const displayName = nameAttr ? `[${nameAttr}] ${child.tagName}` : `${child.tagName}#${child.id || ''}`;
                      const { item } = makeHierarchyItem(child, displayName);
                      container.appendChild(item);
                  }

              } else if (selectionMode === 'exact') {
                  if (child.id || tag === 'g') {
                      const nameAttr = child.getAttribute('name') || child.getAttribute('Name') || child.id;
                      const displayName = nameAttr ? `[${nameAttr}] ${child.tagName}` : `${child.tagName}#${child.id || ''}`;
                      const { item } = makeHierarchyItem(child, displayName);
                      if (child.children.length > 0) {
                          const childrenContainer = document.createElement('div');
                          childrenContainer.className = 'hierarchy-children';
                          buildTree(child, childrenContainer);
                          if (childrenContainer.children.length > 0) item.appendChild(childrenContainer);
                      }
                      container.appendChild(item);
                  }

              } else if (selectionMode === 'name_attr') {
                  if (tag === 'g' && child.hasAttribute('Tag')) {
                      // Tag 속성이 있는 <g>: 그룹 노드로 표시
                      const { item } = makeHierarchyItem(child, child.getAttribute('Tag'));
                      if (child.children.length > 0) {
                          const childrenContainer = document.createElement('div');
                          childrenContainer.className = 'hierarchy-children';
                          buildTree(child, childrenContainer);
                          if (childrenContainer.children.length > 0) item.appendChild(childrenContainer);
                      }
                      container.appendChild(item);
                  } else if (tag === 'g' && node === svgEl) {
                      // SVG 루트 직속 <g>이면서 Tag 없음: 완전히 제외
                  } else if (tag === 'g') {
                      // 내부 Tag 없는 <g>: id/name으로 표시하고 자식도 계층에 포함
                      const nameAttr = child.getAttribute('name') || child.getAttribute('Name');
                      const displayName = nameAttr ? nameAttr : `g [${child.id}]`;
                      const { item } = makeHierarchyItem(child, displayName);
                      if (child.children.length > 0) {
                          const childrenContainer = document.createElement('div');
                          childrenContainer.className = 'hierarchy-children';
                          buildTree(child, childrenContainer);
                          if (childrenContainer.children.length > 0) item.appendChild(childrenContainer);
                      }
                      container.appendChild(item);
                  } else {
                      // 리프 요소 (text, rect, path 등): 태그명 + id로 표시
                      const displayName = child.id ? `${child.tagName} [${child.id}]` : child.tagName;
                      const { item } = makeHierarchyItem(child, displayName);
                      container.appendChild(item);
                  }
              }
          });
      }

      buildTree(svgEl, hierarchyContent);
  }

  // 5. Handle Clicks
  svgContainer.addEventListener('click', (e) => {
    const selectionMode = document.querySelector('input[name="selectionMode"]:checked').value;
    let target = e.target;
    let foundTarget = null;
    let domPath = [];

    // Traverse upwards to find the grouping based on the chosen mode
    while (target && target !== e.currentTarget && target.tagName.toLowerCase() !== 'svg') {
      domPath.unshift(target.tagName.toLowerCase() + (target.id ? `#${target.id}` : ''));

      if (target.getAttribute('data-root-g') === 'true') {
        break; // Stop before the outermost wrapper
      }

      // Custom Grouping Logic by "Tag" Attribute
      if (selectionMode === 'name_attr' && target.tagName.toLowerCase() === 'g' && target.hasAttribute('Tag')) {
          foundTarget = target;
          break;
      }

      if (target.id) {
        if (selectionMode === 'exact' && !foundTarget) {
            foundTarget = target;
        } else if (selectionMode === 'topmost') {
            foundTarget = target;
        } else if (selectionMode === 'name_attr' && !foundTarget) {
            foundTarget = target; // Tag 그룹 없으면 현재 요소 선택
        }
      }
      target = target.parentElement;
    }

    // Clear old selection
    const oldSel = document.querySelectorAll('[data-svg-selected="true"]');
    oldSel.forEach(el => {
        el.removeAttribute('data-svg-selected');
        el.style.stroke = el.dataset.origStroke || '';
        el.style.strokeWidth = el.dataset.origStrokeWidth || '';
    });

    document.querySelectorAll('.hierarchy-item.active').forEach(el => el.classList.remove('active'));

    if (foundTarget) {
      e.stopPropagation();
      selectElementById(foundTarget.id, domPath);
    } else {
      inspectorContent.innerHTML = `<strong>DOM Path from click:</strong><br/><span style="color:#888;font-size:11px;">${domPath.join(' > ')}</span><br/><br/><span style="color:red;">No valid grouping found based on selected mode.</span>`;
    }
  });

  function selectElementById(id, domPath = [], zoomFit = false) {
      if (!id) return;
      const foundTarget = document.getElementById(id);
      if (!foundTarget) return;

      // Clear old highlight
      const oldSel = document.querySelectorAll('[data-svg-selected="true"]');
      oldSel.forEach(el => {
          el.removeAttribute('data-svg-selected');
          el.style.stroke = el.dataset.origStroke || '';
          el.style.strokeWidth = el.dataset.origStrokeWidth || '';
      });
      document.querySelectorAll('.hierarchy-item.active').forEach(el => el.classList.remove('active'));

      currentSelectedId = id;

      if (!foundTarget.hasAttribute('data-orig-stroke')) {
         foundTarget.dataset.origStroke = foundTarget.style.stroke || foundTarget.getAttribute('stroke') || '';
         foundTarget.dataset.origStrokeWidth = foundTarget.style.strokeWidth || foundTarget.getAttribute('stroke-width') || '';
      }
      foundTarget.setAttribute('data-svg-selected', 'true');

      // Recursively apply to children so everything highlights when grouped
      const children = foundTarget.querySelectorAll('*');
      children.forEach(child => {
          if (!child.hasAttribute('data-orig-stroke')) child.dataset.origStroke = child.style.stroke || child.getAttribute('stroke') || '';
          child.setAttribute('data-svg-selected', 'true');
      });

      // Update Inspector
      const props = {};
      for (const attr of foundTarget.attributes) {
         if (!['data-svg-selected', 'data-orig-stroke', 'data-orig-stroke-width', 'style', 'data-root-g'].includes(attr.name)) {
            props[attr.name] = attr.value;
         }
      }

      let pathHtml = domPath.length > 0 ? `<strong>DOM Path from click:</strong><br/><span style="color:#888;font-size:11px;">${domPath.join(' > ')}</span><br/><br/>` : '';
      inspectorContent.innerHTML = `${pathHtml}<strong>Resolved Element:</strong> ${foundTarget.tagName} (#${foundTarget.id})<br/><br/><strong>Attributes:</strong><pre>${JSON.stringify(props, null, 2)}</pre>`;

      // Highlight in hierarchy
      const hierarchyItems = Array.from(document.querySelectorAll('.hierarchy-item'));
      const targetItem = hierarchyItems.find(item => item.dataset.elementId === id);
      if (targetItem) {
          targetItem.classList.add('active');
          targetItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      if (zoomFit) zoomFitToElement(foundTarget);
  }


  // --- SVG Text Viewer ---

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function hlAttrs(str) {
    const re = /([\w:.-]+)\s*=\s*"([^"]*)"/g;
    let result = '', last = 0, m;
    while ((m = re.exec(str)) !== null) {
      if (m.index > last) result += escHtml(str.slice(last, m.index));
      result += ` <span class="sv-attr">${escHtml(m[1])}</span>=<span class="sv-val">"${escHtml(m[2])}"</span>`;
      last = m.index + m[0].length;
    }
    if (last < str.length) result += escHtml(str.slice(last));
    return result;
  }

  function hlToken(tok) {
    if (tok.startsWith('<?') || tok.startsWith('<!')) {
      return `<span class="sv-comment">${escHtml(tok)}</span>`;
    }
    if (tok.startsWith('</')) {
      const name = tok.slice(2, -1).trim();
      return `<span class="sv-bracket">&lt;/</span><span class="sv-tag">${escHtml(name)}</span><span class="sv-bracket">&gt;</span>`;
    }
    const selfClose = tok.endsWith('/>');
    const inner = selfClose ? tok.slice(1, -2).trim() : tok.slice(1, -1).trim();
    const spaceIdx = inner.search(/\s/);
    const tagName = spaceIdx === -1 ? inner : inner.slice(0, spaceIdx);
    const attrsStr = spaceIdx === -1 ? '' : inner.slice(spaceIdx);
    return `<span class="sv-bracket">&lt;</span><span class="sv-tag">${escHtml(tagName)}</span>${hlAttrs(attrsStr)}<span class="sv-bracket">${selfClose ? ' /&gt;' : '&gt;'}</span>`;
  }

  function buildSVGViewerHTML(svgStr) {
    const cleaned = svgStr.replace(/>\s+</g, '><').trim();
    const tokens = cleaned.match(/<[^>]*>|[^<]+/g) || [];
    let depth = 0;
    const parts = [];
    for (const tok of tokens) {
      const t = tok.trim();
      if (!t) continue;
      if (t.startsWith('</')) {
        depth = Math.max(0, depth - 1);
        parts.push('  '.repeat(depth) + hlToken(t));
      } else if (t.startsWith('<') && (t.endsWith('/>') || t.startsWith('<?') || t.startsWith('<!'))) {
        parts.push('  '.repeat(depth) + hlToken(t));
      } else if (t.startsWith('<')) {
        parts.push('  '.repeat(depth) + hlToken(t));
        depth++;
      } else {
        parts.push('  '.repeat(depth) + `<span class="sv-text">${escHtml(t)}</span>`);
      }
    }
    return parts.join('\n');
  }

  document.getElementById('svg-viewer-btn').addEventListener('click', () => {
    if (!rawSvgString) { alert('SVG 파일을 먼저 로드해주세요.'); return; }
    document.getElementById('svg-viewer-content').innerHTML = buildSVGViewerHTML(rawSvgString);
    document.getElementById('svg-viewer-modal').classList.add('open');
  });

  document.getElementById('svg-modal-close').addEventListener('click', () => {
    document.getElementById('svg-viewer-modal').classList.remove('open');
  });

  document.getElementById('svg-viewer-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
  });

  document.getElementById('svg-copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(rawSvgString).then(() => {
      const btn = document.getElementById('svg-copy-btn');
      btn.textContent = '복사됨!';
      setTimeout(() => btn.textContent = '복사', 2000);
    });
  });

</script>

<div id="svg-viewer-modal" class="svg-modal">
  <div class="svg-modal-box">
    <div class="svg-modal-header">
      <h3>SVG 소스 뷰어 (들여쓰기)</h3>
      <div class="svg-modal-actions">
        <button class="svg-modal-action-btn" id="svg-copy-btn">복사</button>
        <button class="svg-modal-close" id="svg-modal-close">&#215;</button>
      </div>
    </div>
    <div class="svg-modal-body">
      <pre id="svg-viewer-content"></pre>
    </div>
  </div>
</div>

</body>
</html>
