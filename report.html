<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주간 업무 보고</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --secondary: #64748b;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #d97706;
    --bg: #f1f5f9;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #94a3b8;
    --sidebar-w: 260px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 18px; }

  /* ── 로그인 ── */
  #login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
  }
  .login-box {
    background: white; border-radius: 16px; padding: 40px; width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .login-box { background: white; border-radius: 12px; padding: 28px; width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,.3); font-size: 17px; }
  .login-box h1 { text-align: center; margin-bottom: 6px; color: var(--primary); font-size: 1.25rem; }
  .login-box p { text-align: center; color: var(--secondary); margin-bottom: 16px; font-size: 15px; }
  .login-box label { font-size: 14px !important; font-weight: 600; }
  .login-box input, .login-box select { font-size: 16px !important; padding: 8px 11px !important; }
  .login-box .btn { font-size: 15px !important; padding: 8px 16px !important; }
  .login-box .btn-block { padding: 10px 16px !important; font-size: 16px !important; }
  .api-config { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 16px; }
  .api-config label { font-size: 14px; font-weight: 600; color: var(--secondary); display: block; margin-bottom: 4px; }
  .login-tabs { display:flex; gap:0; margin-bottom:16px; border-radius:8px; overflow:hidden; border:1.5px solid var(--border); }
  .login-tab { flex:1; padding:9px; text-align:center; cursor:pointer; font-size:15px; font-weight:600; color:var(--secondary); background:#f8fafc; transition:all .2s; }
  .login-tab.active { background:var(--primary); color:white; }
  .login-panel { display:none; }
  .login-panel.active { display:block; }
  .login-box .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .login-box .form-group { margin-bottom:12px; }

  /* ── 공용 폼 ── */
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 16px; font-weight: 600; color: var(--secondary); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 18px; transition: border .2s; background: white;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
  textarea { resize: vertical; min-height: 70px; }
  .btn {
    padding: 9px 18px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 17px; font-weight: 600; transition: all .2s;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-success { background: var(--success); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-secondary { background: var(--secondary); color: white; }
  .btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
  .btn-sm { padding: 7px 14px; font-size: 16px; }
  .btn-block { width: 100%; }

  /* ── 레이아웃 ── */
  #app { display: none; min-height: 100vh; }
  .topbar {
    height: 64px; background: var(--primary); color: white;
    display: flex; align-items: center; padding: 0 20px; gap: 12px;
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .topbar h2 { font-size: 1.2rem; flex: 1; }
  .topbar .user-info { font-size: 16px; opacity: .85; }
  .sidebar {
    width: var(--sidebar-w); background: #1e293b; position: fixed;
    top: 64px; left: 0; bottom: 0; overflow-y: auto; padding: 12px 0;
  }
  .sidebar a {
    display: flex; align-items: center; gap: 10px; padding: 10px 20px;
    color: #cbd5e1; text-decoration: none; font-size: 17px; transition: all .2s;
    border-left: 3px solid transparent;
  }
  .sidebar a:hover, .sidebar a.active {
    background: rgba(255,255,255,.08); color: white; border-left-color: var(--primary);
  }
  .sidebar .nav-section {
    font-size: 14px; font-weight: 700; color: #475569; padding: 16px 20px 4px;
    text-transform: uppercase; letter-spacing: .08em;
  }
  .main { margin-left: var(--sidebar-w); margin-top: 64px; padding: 24px; min-height: calc(100vh - 64px); }

  /* ── 카드 ── */
  .card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
  .card-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-header h3 { font-size: 15px; font-weight: 700; }
  .card-body { padding: 20px; }

  /* ── 테이블 ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    background: #f8fafc; padding: 10px 12px; text-align: left;
    font-size: 15px; font-weight: 700; color: var(--secondary);
    border-bottom: 2px solid var(--border); white-space: nowrap;
  }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8fafc; }

  /* ── 배지 ── */
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 15px; font-weight: 700;
  }
  .badge-admin { background: #fef3c7; color: #92400e; }
  .badge-team { background: #dbeafe; color: #1e40af; }
  .badge-group { background: #dcfce7; color: #166534; }
  .badge-line { background: #fce7f3; color: #9d174d; }
  .badge-member { background: #f3e8ff; color: #6b21a8; }
  .badge-done { background: #dcfce7; color: #166534; }
  .badge-progress { background: #dbeafe; color: #1e40af; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-hold { background: #fee2e2; color: #991b1b; }

  /* ── 모달 ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
    z-index: 200; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white; border-radius: 16px; padding: 28px; width: 640px;
    max-width: 95vw; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,.3);
  }
  .modal h3 { font-size: 16px; margin-bottom: 20px; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* ── 주간 보고 뷰 ── */
  .week-nav {
    display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    background: white; padding: 12px 20px; border-radius: 12px; border: 1px solid var(--border);
  }
  .week-nav strong { font-size: 15px; min-width: 120px; text-align: center; }
  .group-section { margin-bottom: 28px; }
  .group-title {
    background: var(--primary); color: white; padding: 10px 16px;
    border-radius: 8px 8px 0 0; font-weight: 700; font-size: 18px;
  }
  .task-section { border: 1px solid var(--border); border-top: none; }
  .task-row {
    padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; font-weight: 600;
  }
  .activity-table td { font-size: 17px; }
  .empty-row td { color: var(--muted); font-style: italic; text-align: center; }

  /* ── 탭 ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
  .tab {
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 17px;
    font-weight: 600; color: var(--secondary); transition: all .2s;
  }
  .tab.active { background: var(--primary); color: white; }
  .tab:not(.active):hover { background: var(--border); }

  /* ── 유틸 ── */
  .flex { display: flex; }
  .gap-8 { gap: 8px; }
  .gap-12 { gap: 12px; }
  .mt-12 { margin-top: 12px; }
  .text-right { text-align: right; }
  .hidden { display: none !important; }
  .page { display: none; }
  .page.active { display: block; }
  .alert {
    padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 17px;
  }
  .alert-error { background: #fee2e2; color: #991b1b; }
  .alert-success { background: #dcfce7; color: #166534; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .attach-list { list-style: none; margin-top: 8px; }
  .attach-list li {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 8px; background: #f8fafc; border-radius: 6px; margin-bottom: 4px; font-size: 16px;
  }
  .attach-list a { color: var(--primary); text-decoration: none; }
  .attach-list a:hover { text-decoration: underline; }

  /* ── 달력 팝업 ── */
  .week-cal-btn { cursor: pointer; background: #eff6ff; border: 1.5px solid #bfdbfe; border-radius: 8px; padding: 6px 16px; font-weight: 700; font-size: 17px; color: #1e40af; transition: all .2s; }
  .week-cal-btn:hover { background: #dbeafe; }
  .cal-popup { display:none; position:absolute; z-index:300; background:white; border-radius:12px; box-shadow:0 8px 40px rgba(0,0,0,.18); padding:16px; min-width:300px; }
  .cal-popup.open { display:block; }
  .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-weight:700; font-size:17px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-day { text-align:center; padding:6px 2px; border-radius:6px; cursor:pointer; font-size:15px; }
  .cal-day:hover { background:#eff6ff; }
  .cal-day.today { background:#dbeafe; font-weight:700; color:#1e40af; }
  .cal-day.in-week { background:#eff6ff; }
  .cal-day.selected-week { background:#2563eb; color:white; border-radius:6px; }
  .cal-day-header { text-align:center; font-size:13px; font-weight:700; color:#94a3b8; padding:4px; }
  .prev-popup { background:#fffbeb; border:1px solid #fcd34d; border-radius:8px; padding:12px 16px; margin-top:6px; }
  .prev-popup table { font-size:15px; }
</style>
</head>
<body>

<!-- ── 로그인 화면 ── -->
<div id="login-screen">
  <div class="login-box">
    <h1>📋 주간 업무 보고</h1>
    <p>Weekly Report System</p>

    <!-- API 서버 주소 (공통) -->
    <div class="api-config">
      <label>API 서버 주소</label>
      <div style="display:flex;gap:6px">
        <input type="text" id="api-url-input" placeholder="http://xxx.xxx.xxx.xxx:8000"
               style="flex:1;min-width:0" oninput="savePendingApiUrl(this.value)" />
        <button class="btn btn-outline btn-sm" onclick="testConnection()" style="white-space:nowrap;flex-shrink:0">연결 확인</button>
      </div>
      <div id="conn-status" style="margin-top:5px;font-size:12px;display:none"></div>
    </div>

    <!-- 탭: 로그인 / 회원가입 / 비밀번호 변경 -->
    <div class="login-tabs">
      <div class="login-tab active" onclick="switchLoginTab('login')">로그인</div>
      <div class="login-tab" onclick="switchLoginTab('register')">회원가입</div>
      <div class="login-tab" onclick="switchLoginTab('chgpw')">비밀번호 변경</div>
    </div>

    <!-- ── 로그인 패널 ── -->
    <div class="login-panel active" id="panel-login">
      <div id="login-error" class="alert alert-error hidden"></div>
      <div class="form-group">
        <label>아이디</label>
        <input type="text" id="login-id" placeholder="아이디 입력" />
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="login-pw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
      <button class="btn btn-primary btn-block" onclick="doLogin()">로그인</button>
    </div>

    <!-- ── 회원가입 패널 ── -->
    <div class="login-panel" id="panel-register">
      <div id="reg-error" class="alert alert-error hidden"></div>
      <div id="reg-success" class="alert alert-success hidden"></div>
      <div class="row2">
        <div class="form-group">
          <label>아이디 *</label>
          <input type="text" id="reg-username" placeholder="영문/숫자" />
        </div>
        <div class="form-group">
          <label>이름 *</label>
          <input type="text" id="reg-fullname" placeholder="실명 입력" />
        </div>
      </div>
      <div class="row2">
        <div class="form-group">
          <label>비밀번호 *</label>
          <input type="password" id="reg-pw" placeholder="비밀번호" />
        </div>
        <div class="form-group">
          <label>비밀번호 확인 *</label>
          <input type="password" id="reg-pw2" placeholder="비밀번호 재입력" />
        </div>
      </div>
      <div class="form-group">
        <label>직급 *</label>
        <select id="reg-role">
          <option value="member">라인원</option>
          <option value="line_leader">라인장</option>
          <option value="group_leader">그룹장</option>
          <option value="team_leader">팀장</option>
        </select>
      </div>
      <div class="row2">
        <div class="form-group">
          <label>팀</label>
          <select id="reg-team" onchange="onRegTeamChange()"><option value="">선택</option></select>
        </div>
        <div class="form-group">
          <label>그룹</label>
          <select id="reg-group" onchange="onRegGroupChange()"><option value="">선택</option></select>
        </div>
      </div>
      <div class="form-group">
        <label>라인</label>
        <select id="reg-line"><option value="">선택</option></select>
      </div>
      <button class="btn btn-primary btn-block" onclick="doRegister()">가입하기</button>
    </div>

    <!-- ── 비밀번호 변경 패널 ── -->
    <div class="login-panel" id="panel-chgpw">
      <div id="chgpw-error" class="alert alert-error hidden"></div>
      <div id="chgpw-success" class="alert alert-success hidden"></div>
      <div class="form-group">
        <label>아이디 *</label>
        <input type="text" id="chgpw-username" placeholder="아이디 입력" />
      </div>
      <div class="form-group">
        <label>현재 비밀번호 *</label>
        <input type="password" id="chgpw-old" placeholder="현재 비밀번호" />
      </div>
      <div class="form-group">
        <label>새 비밀번호 *</label>
        <input type="password" id="chgpw-new" placeholder="새 비밀번호" />
      </div>
      <div class="form-group">
        <label>새 비밀번호 확인 *</label>
        <input type="password" id="chgpw-new2" placeholder="새 비밀번호 재입력" onkeydown="if(event.key==='Enter')doChangePw()" />
      </div>
      <button class="btn btn-primary btn-block" onclick="doChangePw()">비밀번호 변경</button>
    </div>

  </div>
</div>

<!-- ── 메인 앱 ── -->
<div id="app">
  <div class="topbar">
    <h2>📋 주간 업무 보고 시스템</h2>
    <span class="user-info" id="topbar-user"></span>
    <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:white" onclick="doLogout()">로그아웃</button>
  </div>

  <nav class="sidebar">
    <div class="nav-section">보고서</div>
    <a href="#" onclick="showPage('weekly')" id="nav-weekly">📊 주간 보고</a>

    <div class="nav-section">관리</div>
    <a href="#" onclick="showPage('org')" id="nav-org" class="admin-only">🏢 조직 관리</a>
    <a href="#" onclick="showPage('tasks')" id="nav-tasks" class="manager-only">📌 업무 관리</a>
    <a href="#" id="nav-users" onclick="showPage('users')" class="admin-only">👥 사용자 관리</a>
  </nav>

  <main class="main">

    <!-- ── 주간 보고 ── -->
    <div class="page" id="page-weekly">
      <div class="week-nav">
        <button class="btn btn-outline btn-sm" onclick="changeWeek(-1)">◀ 이전주</button>
        <div style="position:relative">
          <button class="week-cal-btn" id="week-label-display" onclick="toggleCal()">2026-W01</button>
          <div class="cal-popup" id="cal-popup"></div>
        </div>
        <button class="btn btn-outline btn-sm" onclick="changeWeek(1)">다음주 ▶</button>
        <select id="filter-group-weekly" onchange="loadWeeklyReport()" style="width:160px;margin-left:8px">
          <option value="">전체 그룹</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="openActivityModal()">+ Activity 추가</button>
      </div>
      <div id="weekly-content"></div>
    </div>

    <!-- ── 조직 관리 ── -->
    <div class="page" id="page-org">
      <div class="tabs">
        <div class="tab active" onclick="switchOrgTab('team')">팀</div>
        <div class="tab" onclick="switchOrgTab('group')">그룹</div>
        <div class="tab" onclick="switchOrgTab('line')">라인</div>
      </div>

      <!-- 팀 -->
      <div id="org-team">
        <div class="card">
          <div class="card-header">
            <h3>팀 목록</h3>
            <button class="btn btn-primary btn-sm" onclick="openTeamModal()">+ 팀 추가</button>
          </div>
          <div class="card-body table-wrap">
            <table><thead><tr><th>#</th><th>팀명</th><th>관리</th></tr></thead>
            <tbody id="team-list"></tbody></table>
          </div>
        </div>
      </div>

      <!-- 그룹 -->
      <div id="org-group" class="hidden">
        <div class="card">
          <div class="card-header">
            <h3>그룹 목록</h3>
            <button class="btn btn-primary btn-sm" onclick="openGroupModal()">+ 그룹 추가</button>
          </div>
          <div class="card-body table-wrap">
            <table><thead><tr><th>#</th><th>그룹명</th><th>소속 팀</th><th>관리</th></tr></thead>
            <tbody id="group-list"></tbody></table>
          </div>
        </div>
      </div>

      <!-- 라인 -->
      <div id="org-line" class="hidden">
        <div class="card">
          <div class="card-header">
            <h3>라인 목록</h3>
            <button class="btn btn-primary btn-sm" onclick="openLineModal()">+ 라인 추가</button>
          </div>
          <div class="card-body table-wrap">
            <table><thead><tr><th>#</th><th>라인명</th><th>소속 그룹</th><th>관리</th></tr></thead>
            <tbody id="line-list"></tbody></table>
          </div>
        </div>
      </div>
    </div>

    <!-- ── 업무 관리 ── -->
    <div class="page" id="page-tasks">
      <div class="card">
        <div class="card-header">
          <h3>업무(Task) 목록</h3>
          <div class="flex gap-8">
            <select id="filter-group-tasks" onchange="loadTasks()" style="width:160px">
              <option value="">전체 그룹</option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="openTaskModal()">+ 업무 추가</button>
          </div>
        </div>
        <div class="card-body table-wrap">
          <table><thead><tr><th>#</th><th>업무명</th><th>그룹</th><th>등록일</th><th>관리</th></tr></thead>
          <tbody id="task-list"></tbody></table>
        </div>
      </div>
    </div>

    <!-- ── 사용자 관리 ── -->
    <div class="page" id="page-users">
      <div class="card">
        <div class="card-header">
          <h3>사용자 목록</h3>
          <button class="btn btn-primary btn-sm" onclick="openUserModal()">+ 사용자 추가</button>
        </div>
        <div class="card-body table-wrap">
          <table><thead><tr><th>#</th><th>아이디</th><th>이름</th><th>직급</th><th>팀</th><th>그룹</th><th>라인</th><th>관리</th></tr></thead>
          <tbody id="user-list"></tbody></table>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- ════ 모달들 ════ -->

<!-- 팀 모달 -->
<div class="modal-overlay" id="modal-team">
  <div class="modal">
    <h3 id="modal-team-title">팀 추가</h3>

<script>
// ════ 전역 상태 ════
let API = '';
let TOKEN = '';
let ME = null;
let currentWeekOffset = 0;
let allTeams = [], allGroups = [], allLines = [], allUsers = [], allTasks = [];

// ════ 저장소 헬퍼 (localStorage 우선, fallback cookie) ════
function setCookie(name, val, days=365) {
  try {
    localStorage.setItem(name, val);
  } catch(e) {
    const d = new Date(); d.setTime(d.getTime() + days*86400000);
    document.cookie = `${name}=${encodeURIComponent(val)};expires=${d.toUTCString()};path=/`;
  }
}
function getCookie(name) {
  try {
    const v = localStorage.getItem(name);
    if (v !== null) return v;
  } catch(e) {}
  return decodeURIComponent(document.cookie.split(';').map(c=>c.trim())
    .find(c=>c.startsWith(name+'='))?.split('=').slice(1).join('=')||'');
}

// ════ API 헬퍼 ════
async function api(method, path, body=null, isForm=false) {
  const opts = {
    method,
    headers: { ...(TOKEN ? {Authorization:`Bearer ${TOKEN}`} : {}) }
  };
  if (body && !isForm) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  } else if (body && isForm) {
    opts.body = body;
  }
  const res = await fetch(API + path, opts);
  if (res.status === 204) return null;
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

// ════ 초기화 ════
function savePendingApiUrl(val) {
  setCookie('api_url', val.trim().replace(/\/$/,''), 365);
}

window.onload = () => {
  const savedApi = getCookie('api_url');
  if (savedApi) {
    document.getElementById('api-url-input').value = savedApi;
    API = savedApi;
  }
  const savedToken = getCookie('token');
  if (savedToken && savedApi) {
    TOKEN = savedToken;
    api('GET','/wr/auth/me').then(u=>{
      ME = u; startApp();
    }).catch(()=>{ TOKEN=''; });
  }
  if (savedApi) loadRegOrgData();
};

// ════ 로그인 탭 전환 ════
function switchLoginTab(tab) {
  document.querySelectorAll('.login-tab').forEach((el,i)=>{
    el.classList.toggle('active', ['login','register','chgpw'][i]===tab);
  });
  document.querySelectorAll('.login-panel').forEach(el=>el.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  if (tab==='register') loadRegOrgData();
}

// ════ 회원가입 조직 데이터 로드 ════
let regTeams=[], regGroups=[], regLines=[];
async function loadRegOrgData() {
  const apiUrl = document.getElementById('api-url-input').value.trim().replace(/\/$/,'');
  if (!apiUrl) return;
  try {
    const [teams, groups, lines] = await Promise.all([
      fetch(apiUrl+'/wr/teams').then(r=>r.ok?r.json():[]),
      fetch(apiUrl+'/wr/groups').then(r=>r.ok?r.json():[]),
      fetch(apiUrl+'/wr/lines').then(r=>r.ok?r.json():[]),
    ]);
    regTeams=teams; regGroups=groups; regLines=lines;
  } catch(e) { return; }
  const tSel=document.getElementById('reg-team');
  tSel.innerHTML='<option value="">선택</option>'+regTeams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
}

function onRegTeamChange() {
  const tid = parseInt(document.getElementById('reg-team').value)||0;
  const gSel = document.getElementById('reg-group');
  const filtered = tid ? regGroups.filter(g=>g.team_id===tid) : regGroups;
  gSel.innerHTML='<option value="">선택</option>'+filtered.map(g=>`<option value="${g.id}">${g.name}</option>`).join('');
  document.getElementById('reg-line').innerHTML='<option value="">선택</option>';
}

function onRegGroupChange() {
  const gid = parseInt(document.getElementById('reg-group').value)||0;
  const lSel = document.getElementById('reg-line');
  const filtered = gid ? regLines.filter(l=>l.group_id===gid) : regLines;
  lSel.innerHTML='<option value="">선택</option>'+filtered.map(l=>`<option value="${l.id}">${l.name}</option>`).join('');
}

// ════ 회원가입 ════
async function doRegister() {
  const apiUrl = document.getElementById('api-url-input').value.trim().replace(/\/$/,'');
  const errEl=document.getElementById('reg-error');
  const okEl=document.getElementById('reg-success');
  errEl.classList.add('hidden'); okEl.classList.add('hidden');

  const username=document.getElementById('reg-username').value.trim();
  const fullname=document.getElementById('reg-fullname').value.trim();
  const pw=document.getElementById('reg-pw').value;
  const pw2=document.getElementById('reg-pw2').value;
  const role=document.getElementById('reg-role').value;
  const team_id=parseInt(document.getElementById('reg-team').value)||null;
  const group_id=parseInt(document.getElementById('reg-group').value)||null;
  const line_id=parseInt(document.getElementById('reg-line').value)||null;

  if (!apiUrl){errEl.textContent='API 서버 주소를 입력하세요';errEl.classList.remove('hidden');return;}
  if (!username||!fullname||!pw){errEl.textContent='아이디, 이름, 비밀번호는 필수입니다';errEl.classList.remove('hidden');return;}
  if (pw!==pw2){errEl.textContent='비밀번호가 일치하지 않습니다';errEl.classList.remove('hidden');return;}

  try {
    const res=await fetch(apiUrl+'/wr/users/register',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,password:pw,full_name:fullname,role,team_id,group_id,line_id})
    });
    if (!res.ok){const d=await res.json().catch(()=>({}));throw new Error(d.detail||res.statusText);}
    okEl.textContent='가입이 완료되었습니다. 로그인하세요.';
    okEl.classList.remove('hidden');
    ['reg-username','reg-fullname','reg-pw','reg-pw2'].forEach(id=>document.getElementById(id).value='');
  } catch(e){errEl.textContent=e.message;errEl.classList.remove('hidden');}
}

// ════ 비밀번호 변경 ════
async function doChangePw() {
  const apiUrl = document.getElementById('api-url-input').value.trim().replace(/\/$/,'');
  const errEl=document.getElementById('chgpw-error');
  const okEl=document.getElementById('chgpw-success');
  errEl.classList.add('hidden'); okEl.classList.add('hidden');

  const username=document.getElementById('chgpw-username').value.trim();
  const oldPw=document.getElementById('chgpw-old').value;
  const newPw=document.getElementById('chgpw-new').value;
  const newPw2=document.getElementById('chgpw-new2').value;

  if (!apiUrl){errEl.textContent='API 서버 주소를 입력하세요';errEl.classList.remove('hidden');return;}
  if (!username||!oldPw||!newPw){errEl.textContent='모든 항목을 입력하세요';errEl.classList.remove('hidden');return;}
  if (newPw!==newPw2){errEl.textContent='새 비밀번호가 일치하지 않습니다';errEl.classList.remove('hidden');return;}

  try {
    const loginRes=await fetch(apiUrl+'/wr/auth/login',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,password:oldPw})
    });
    if (!loginRes.ok){const d=await loginRes.json().catch(()=>({}));throw new Error(d.detail||'현재 비밀번호가 틀립니다');}
    const {token,user}=await loginRes.json();

    const updRes=await fetch(apiUrl+`/wr/users/${user.id}`,{
      method:'PUT',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
      body:JSON.stringify({password:newPw})
    });
    if (!updRes.ok){const d=await updRes.json().catch(()=>({}));throw new Error(d.detail||updRes.statusText);}
    okEl.textContent='비밀번호가 변경되었습니다. 새 비밀번호로 로그인하세요.';
    okEl.classList.remove('hidden');
    ['chgpw-old','chgpw-new','chgpw-new2'].forEach(id=>document.getElementById(id).value='');
  } catch(e){errEl.textContent=e.message;errEl.classList.remove('hidden');}
}

async function doLogin() {
  const apiUrl = document.getElementById('api-url-input').value.trim().replace(/\/$/,'');
  const username = document.getElementById('login-id').value.trim();
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');

  if (!apiUrl) { errEl.textContent='API 서버 주소를 입력하세요'; errEl.classList.remove('hidden'); return; }
  if (!username || !pw) { errEl.textContent='아이디와 비밀번호를 입력하세요'; errEl.classList.remove('hidden'); return; }

  API = apiUrl;
  try {
    const data = await api('POST', '/wr/auth/login', {username, password: pw});
    TOKEN = data.token;
    ME = data.user;
    setCookie('api_url', apiUrl);
    setCookie('token', TOKEN, 1);
    startApp();
  } catch(e) {
    let msg = e.message;
    if (msg.includes('Failed to fetch') || msg.includes('ERR_CONNECTION_REFUSED') || msg.includes('NetworkError')) {
      msg = `서버에 연결할 수 없습니다.\n접속 주소: ${apiUrl}/wr/auth/login\n\n확인사항:\n• 서버가 실행 중인지 확인\n• IP/포트가 정확한지 확인\n• uvicorn 실행 시 --host 0.0.0.0 옵션 사용 여부\n• 방화벽에서 ${apiUrl.split(':')[2] || 8000}번 포트 허용 여부`;
    }
    errEl.style.whiteSpace = 'pre-line';
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
  }
}

async function testConnection() {
  const apiUrl = document.getElementById('api-url-input').value.trim().replace(/\/$/,'');
  const statusEl = document.getElementById('conn-status');
  if (!apiUrl) { statusEl.style.display='block'; statusEl.style.color='#dc2626'; statusEl.textContent='주소를 입력하세요'; return; }
  statusEl.style.display='block'; statusEl.style.color='#64748b'; statusEl.textContent='연결 확인 중...';
  try {
    const res = await fetch(apiUrl + '/docs', {method:'GET', signal: AbortSignal.timeout(5000)});
    if (res.ok || res.status === 200) {
      statusEl.style.color='#16a34a'; statusEl.textContent='✅ 서버 연결 성공! 로그인하세요.';
    } else {
      statusEl.style.color='#d97706'; statusEl.textContent=`⚠️ 서버 응답: HTTP ${res.status}`;
    }
  } catch(e) {
    statusEl.style.color='#dc2626';
    if (e.name === 'TimeoutError') {
      statusEl.textContent = '❌ 연결 시간 초과 (5초) — IP/포트 확인 필요';
    } else {
      statusEl.textContent = `❌ 연결 실패 — ${apiUrl} 접근 불가\n서버에서 uvicorn --host 0.0.0.0 으로 실행했는지 확인`;
    }
    statusEl.style.whiteSpace = 'pre-line';
  }
}

function doLogout() {
  TOKEN = ''; ME = null;
  setCookie('token', '', -1);
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function startApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('topbar-user').textContent = `${ME.full_name} (${roleLabel(ME.role)})`;

  // admin만 조직/사용자 관리
  document.querySelectorAll('.admin-only').forEach(el => {
    if (ME.role !== 'admin') el.classList.add('hidden');
  });
  // 관리자급만 업무관리
  document.querySelectorAll('.manager-only').forEach(el => {
    if (!['admin','team_leader','group_leader','line_leader'].includes(ME.role)) el.classList.add('hidden');
  });

  await Promise.all([loadMasterData()]);
  showPage('weekly');
}

function roleLabel(r) {
  return {admin:'시스템Admin',team_leader:'팀장',group_leader:'그룹장',line_leader:'라인장',member:'라인원'}[r] || r;
}

async function loadMasterData() {
  [allTeams, allGroups, allLines, allUsers, allTasks] = await Promise.all([
    api('GET','/wr/teams'),
    api('GET','/wr/groups'),
    api('GET','/wr/lines'),
    api('GET','/wr/users'),
    api('GET','/wr/tasks'),
  ]).catch(()=>[[],[],[],[],[]]);

  fillGroupFilter('filter-group-weekly');
  fillGroupFilter('filter-group-tasks');
}

function fillGroupFilter(selId) {
  const sel = document.getElementById(selId);
  const cur = sel.value;
  sel.innerHTML = '<option value="">전체 그룹</option>';
  allGroups.forEach(g => {
    sel.innerHTML += `<option value="${g.id}">${g.name} (${g.team_name||''})</option>`;
  });
  sel.value = cur;
}

// ════ 페이지 전환 ════
function showPage(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('nav-'+name)?.classList.add('active');
  if (name==='weekly') loadWeeklyReport();
  if (name==='org')    { loadOrgTeam(); loadOrgGroup(); loadOrgLine(); }
  if (name==='tasks')  loadTasks();
  if (name==='users')  loadUsers();
}

// ════ 주간 유틸 ════
function getWeekLabel(offset=0) {
  const d = new Date();
  d.setDate(d.getDate() + offset*7);
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${String(week).padStart(2,'0')}`;
}

function changeWeek(delta) {
  currentWeekOffset += delta;
  loadWeeklyReport();
}

async function loadWeeklyReport() {
  const lbl = getWeekLabel(currentWeekOffset);
  // compute monday-sunday of this week
  const monday = getMonday(new Date(new Date().setDate(new Date().getDate() + currentWeekOffset*7)));
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  const display = `${lbl} (${fmt(monday)}~${fmt(sunday)})`;
  document.getElementById('week-label-display').textContent = display;
  const gid = document.getElementById('filter-group-weekly').value;
  const url = `/wr/weekly-report?week_label=${lbl}` + (gid ? `&group_id=${gid}` : '');
  const data = await api('GET', url).catch(()=>[]);
  renderWeekly(data, lbl);
}

function statusBadge(s) {
  const map = {'완료':'done','진행중':'progress','예정':'pending','보류':'hold'};
  return s ? `<span class="badge badge-${map[s]||'pending'}">${s}</span>` : '-';
}

function renderWeekly(groups, weekLabel) {
  const el = document.getElementById('weekly-content');
  if (!groups.length) { el.innerHTML='<p style="color:var(--muted)">데이터가 없습니다.</p>'; return; }
  let html = '';
  groups.forEach(grp => {
    if (!grp.tasks.length) return;
    html += `<div class="group-section">
      <div class="group-title">📁 ${grp.name}</div>
      <div class="task-section">`;
    grp.tasks.forEach(task => {
      html += `<div class="task-row">
        <span style="flex:1">📌 ${task.name}</span>
        <button class="btn btn-primary btn-sm" onclick="openActivityModal(${task.id},${grp.id})">+ Activity</button>
      </div>
      <table class="activity-table" style="width:100%">
        <thead><tr>
          <th style="width:30%">Activity</th><th style="width:15%">상태</th>
          <th style="width:25%">일정</th><th style="width:15%">담당자</th><th>관리</th>
        </tr></thead><tbody>`;
      if (!task.activities.length) {
        html += `<tr class="empty-row"><td colspan="5">등록된 Activity가 없습니다</td></tr>`;
      } else {
        task.activities.forEach(act => {
          html += `<tr id="act-row-${act.id}">
            <td>
              <strong>${act.name}</strong>
              ${act.note?`<br><small style="color:var(--muted)">${act.note}</small>`:''}
              <br>
              <button class="btn btn-outline btn-sm" style="margin-top:4px;font-size:13px" onclick="togglePrevWeek(${act.id},'${act.name.replace(/'/g,"\\'")}',${act.task_id})">📅 이전주</button>
              <a href="#" onclick="showAttachments(${act.id});return false;" style="font-size:14px;color:var(--primary);margin-left:8px">📎</a>
            </td>
            <td>${statusBadge(act.status)}</td>
            <td style="font-size:15px">${act.schedule||'-'}</td>
            <td>${act.assignee_name||'-'}</td>
            <td>
              <button class="btn btn-outline btn-sm" onclick="openEditActivity(${act.id})">수정</button>
              <button class="btn btn-danger btn-sm" onclick="deleteActivity(${act.id})">삭제</button>
            </td>
          </tr>
          <tr id="prev-popup-${act.id}" style="display:none">
            <td colspan="5">
              <div class="prev-popup" id="prev-popup-content-${act.id}">로딩 중...</div>
            </td>
          </tr>`;
        });
      }
      html += `</tbody></table>`;
    });
    html += `</div></div>`;
  });
  el.innerHTML = html || '<p style="color:var(--muted)">데이터가 없습니다.</p>';
}

// ════ 이전주 인라인 팝업 ════
async function togglePrevWeek(actId, actName, taskId) {
  const row = document.getElementById(`prev-popup-${actId}`);
  if (row.style.display !== 'none') { row.style.display = 'none'; return; }
  row.style.display = '';
  const content = document.getElementById(`prev-popup-content-${actId}`);
  content.textContent = '이전주 데이터 로딩 중...';
  const curWeek = getWeekLabel(currentWeekOffset);
  const data = await api('GET', `/wr/activities/copy-from-prev-week?current_week=${curWeek}&task_id=${taskId}`).catch(()=>null);
  if (!data || !data.activities.length) {
    content.innerHTML = `<span style="color:var(--muted)">이전주(${data?.prev_week||''}) 데이터 없음</span>`;
    return;
  }
  const prev = data.activities.filter(a => a.name === actName);
  if (!prev.length) {
    content.innerHTML = `<span style="color:var(--muted)">이전주에 동일 Activity 없음</span>`;
    return;
  }
  const p = prev[0];
  content.innerHTML = `
    <div style="font-weight:700;color:#92400e;margin-bottom:8px">📅 이전주 (${data.prev_week}) - ${p.name}</div>
    <table style="width:100%">
      <tr><th style="width:80px">상태</th><td>${statusBadge(p.status)}</td></tr>
      <tr><th>일정</th><td>${p.schedule||'-'}</td></tr>
      <tr><th>담당자</th><td>${p.assignee_name||'-'}</td></tr>
      <tr><th>비고</th><td>${p.note||'-'}</td></tr>
    </table>`;
}

async function openEditActivity(id) {
  const acts = await api('GET', `/wr/activities?week_label=${getWeekLabel(currentWeekOffset)}`).catch(()=>[]);
  const act = acts.find(a=>a.id===id);

  document.getElementById('modal-act-title').textContent = 'Activity 수정';

  document.getElementById('act-name').value = act.name;
  document.getElementById('act-status').value = act.status||'';
  document.getElementById('act-schedule').value = act.schedule||'';
  document.getElementById('act-note').value = act.note||'';

  const gSel = document.getElementById('act-group-id');
  gSel.innerHTML = '<option value="">선택</option>' + allGroups.map(g=>
    `<option value="${g.id}">${g.name}</option>`).join('');
  gSel.value = act.group_id;
  await loadTasksForAct();
  document.getElementById('act-task-id').value = act.task_id;

  const uSel = document.getElementById('act-assignee');
  uSel.innerHTML = '<option value="">선택</option>' + allUsers.map(u=>
    `<option value="${u.id}">${u.full_name}</option>`).join('');
  uSel.value = act.assignee_id||'';

  // 첨부파일
  document.getElementById('attach-note').textContent = '';
  document.getElementById('attach-upload-btn').disabled = false;
  document.getElementById('prev-week-banner').classList.add('hidden');
  await refreshAttachList(id);
  openModal('modal-activity');
}

async function refreshAttachList(actId) {
  const list = await api('GET', `/wr/activities/${actId}/attachments`).catch(()=>[]);
  document.getElementById('attach-list').innerHTML = list.map(f =>
    `<li>
      <a href="${API}/attachments/${f.id}" target="_blank">📎 ${f.filename}</a>
      <button class="btn btn-danger btn-sm" onclick="deleteAttachment(${f.id},${actId})">삭제</button>
    </li>`
  ).join('') || '<li style="color:var(--muted)">첨부파일 없음</li>';
}

async function uploadAttachments() {
  const actId = document.getElementById('act-id').value;
  if (!actId) return alert('먼저 Activity를 저장하세요');
  const files = document.getElementById('attach-file').files;
  for (const f of files) {
    const fd = new FormData(); fd.append('file', f);
    await api('POST', `/wr/activities/${actId}/attachments`, fd, true);
  }
  document.getElementById('attach-file').value = '';
  await refreshAttachList(parseInt(actId));
}

async function deleteAttachment(fid, actId) {
  if (!confirm('첨부파일을 삭제할까요?')) return;
  await api('DELETE', `/wr/attachments/${fid}`);
  await refreshAttachList(actId);
}

async function deleteActivity(id) {
  if (!confirm('삭제할까요?')) return;
  await api('DELETE', `/wr/activities/${id}`);
  loadWeeklyReport();

// ════ 주차 달력 ════
let calYear, calMonth;

function toggleCal() {
  const popup = document.getElementById('cal-popup');
  popup.classList.toggle('open');
  if (popup.classList.contains('open')) {
    const today = new Date();
    calYear = today.getFullYear();
    calMonth = today.getMonth();
    renderCal();
  }
}

function renderCal() {
  const today = new Date();
  // compute current selected week's monday
  const selDate = new Date();
  selDate.setDate(selDate.getDate() + currentWeekOffset * 7);
  const selMonday = getMonday(selDate);

  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay = new Date(calYear, calMonth + 1, 0);

  const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  let html = `<div class="cal-header">
    <button onclick="calNav(-1)" style="background:none;border:none;cursor:pointer;font-size:18px">◀</button>
    <span>${calYear}년 ${monthNames[calMonth]}</span>
    <button onclick="calNav(1)" style="background:none;border:none;cursor:pointer;font-size:18px">▶</button>
  </div>
  <div class="cal-grid">
    <div class="cal-day-header">일</div><div class="cal-day-header">월</div><div class="cal-day-header">화</div>
    <div class="cal-day-header">수</div><div class="cal-day-header">목</div><div class="cal-day-header">금</div>
    <div class="cal-day-header">토</div>`;

  // blank cells before first day
  for (let i = 0; i < firstDay.getDay(); i++) html += '<div></div>';

  for (let d = 1; d <= lastDay.getDate(); d++) {
    const date = new Date(calYear, calMonth, d);
    const monday = getMonday(date);
    const isToday = date.toDateString() === today.toDateString();
    const isSelWeek = monday.toDateString() === selMonday.toDateString();
    let cls = 'cal-day';
    if (isSelWeek) cls += ' selected-week';
    else if (isToday) cls += ' today';
    html += `<div class="${cls}" onclick="selectCalWeek(${calYear},${calMonth},${d})">${d}</div>`;
  }
  html += '</div>';
  document.getElementById('cal-popup').innerHTML = html;
}

function calNav(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCal();
}

function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(d.setDate(diff));
}

function selectCalWeek(y, m, d) {
  const clicked = new Date(y, m, d);
  const today = new Date();
  today.setHours(0,0,0,0);
  clicked.setHours(0,0,0,0);
  const todayMonday = getMonday(today);
  const clickedMonday = getMonday(clicked);
  const diffMs = clickedMonday - todayMonday;
  currentWeekOffset = Math.round(diffMs / (7 * 24 * 60 * 60 * 1000));
  document.getElementById('cal-popup').classList.remove('open');
  loadWeeklyReport();
}

// close cal on outside click
document.addEventListener('click', e => {
  const popup = document.getElementById('cal-popup');
  const btn = document.getElementById('week-label-display');
  if (popup && !popup.contains(e.target) && btn && !btn.contains(e.target)) {
    popup.classList.remove('open');
  }
});
</script>
